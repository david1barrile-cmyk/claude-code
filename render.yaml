# Render Blueprint for Fantasy Hub (https://render.com/docs/blueprint-spec).
# In Render: New + → Blueprint → pick this repository. You'll be asked for LEAGUE_ID.
services:
  - type: web
    name: fantasy-hub
    runtime: node
    plan: free
    rootDir: fantasy-hub
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: LEAGUE_ID
        sync: false   # your Sleeper league ID (the number in sleeper.com/leagues/<id>)
      - key: SITE_PASSWORD
        sync: false   # optional: leave blank for a public site
      - key: CFBD_API_KEY
        sync: false   # optional: free key from collegefootballdata.com for rookie college stats
      - key: ANTHROPIC_API_KEY
        sync: false   # optional: lets Claude write the League Gazette (otherwise the built-in joke writer does)
