<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlatePricer</title>
<meta name="description" content="Compare delivery prices across Uber Eats, DoorDash and ordering direct from the restaurant.">
<style>
:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface-2: #f0eee9; --text: #1c1b19; --muted: #6b675f;
  --border: #e3e0d8; --accent: #0f7b5f; --accent-soft: #e2f3ed; --warn: #b4531a; --warn-soft: #fbeee4;
  --ue: #06c167; --dd: #eb1700; --direct: #2a5bd7; --star: #e0a100; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1d1c1a; --surface-2: #262522; --text: #f1efe9; --muted: #a29e94;
    --border: #34322e; --accent: #3fc79c; --accent-soft: #173229; --warn: #f0965a; --warn-soft: #3a2518;
    --ue: #2fd987; --dd: #ff5a45; --direct: #7b9dff; --star: #f2c14e; --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1d1c1a; --surface-2: #262522; --text: #f1efe9; --muted: #a29e94;
  --border: #34322e; --accent: #3fc79c; --accent-soft: #173229; --warn: #f0965a; --warn-soft: #3a2518;
  --ue: #2fd987; --dd: #ff5a45; --direct: #7b9dff; --star: #f2c14e; --shadow: 0 1px 2px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
.brand { font-weight: 750; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; }
.brand .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: inline-grid; place-items: center; color: var(--bg); font-size: 13px; }
.addr-pill { margin-left: auto; display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); max-width: 30vw; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.cart-btn { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; border: 0; background: var(--text); color: var(--bg); font-weight: 600; }
.cart-btn .count { background: var(--accent); color: #fff; border-radius: 999px; min-width: 20px; padding: 0 6px; font-size: 12px; text-align: center; }

/* Landing */
.hero { padding: 72px 0 48px; text-align: center; }
.hero h1 { font-size: clamp(30px, 5vw, 48px); line-height: 1.1; letter-spacing: -.02em; margin: 0 0 12px; }
.hero p { color: var(--muted); max-width: 560px; margin: 0 auto 28px; font-size: 17px; }
.addr-form { display: flex; gap: 8px; max-width: 560px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
.addr-form input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 12px; outline: none; }
.addr-form button { border: 0; background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 600; }
.legend { display: flex; justify-content: center; flex-wrap: wrap; gap: 18px; margin-top: 28px; color: var(--muted); font-size: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.swatch { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Browse */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 20px 0 8px; }
.toolbar h2 { margin: 0 auto 0 0; font-size: 22px; letter-spacing: -.01em; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.ctl select { padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 16px; scrollbar-width: none; }
.chip { flex: none; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding-bottom: 48px; }
.card { display: flex; flex-direction: column; justify-content: flex-start; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; padding: 0; box-shadow: var(--shadow); transition: transform .12s; }
.card:hover { transform: translateY(-2px); }
.card .banner { flex: none; width: 100%; height: 96px; display: grid; place-items: center; font-size: 42px; }
.card .body { padding: 12px 14px 14px; }
.card h3 { margin: 0 0 2px; font-size: 16px; }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.star { color: var(--star); }
.platforms { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.tag.save { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; grid-column: 1 / -1; }

/* Restaurant */
.back { background: none; border: 0; color: var(--muted); padding: 16px 0 0; }
.r-head { display: flex; gap: 16px; align-items: center; padding: 12px 0 20px; flex-wrap: wrap; }
.r-head .logo { width: 72px; height: 72px; border-radius: 16px; display: grid; place-items: center; font-size: 38px; flex: none; }
.r-head h2 { margin: 0; font-size: 26px; letter-spacing: -.01em; }
.fee-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.fee-table th, .fee-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
.fee-table th:first-child, .fee-table td:first-child { text-align: left; }
.fee-table tr:last-child td { border-bottom: 0; }
.fee-wrap { overflow-x: auto; }
.menu-section h3 { font-size: 17px; margin: 24px 0 10px; }
.item { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.item .name { font-weight: 600; }
.item .desc { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.prices { display: flex; flex-wrap: wrap; gap: 6px; }
.price { font-size: 13px; padding: 3px 8px; border-radius: 7px; border: 1px solid var(--border); display: inline-flex; gap: 6px; align-items: baseline; font-variant-numeric: tabular-nums; }
.price b { font-weight: 650; }
.price.instore { background: var(--surface-2); }
.price .pct { font-size: 11px; color: var(--warn); }
.price.best { border-color: var(--accent); background: var(--accent-soft); }
.price.na { opacity: .5; }
.add { border: 0; background: var(--text); color: var(--bg); border-radius: 999px; width: 36px; height: 36px; font-size: 20px; line-height: 1; }
.qty { display: flex; align-items: center; gap: 8px; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); }

/* Cart drawer */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 20; }
.scrim.open { opacity: 1; pointer-events: auto; }
aside.cart { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100%); background: var(--bg); border-left: 1px solid var(--border); z-index: 21; transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; }
aside.cart.open { transform: none; }
.cart-head { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
.cart-head h2 { margin: 0; font-size: 19px; }
.x { border: 0; background: none; font-size: 24px; color: var(--muted); }
.cart-body { flex: 1; overflow-y: auto; padding: 16px; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.line .qty button { width: 24px; height: 24px; font-size: 13px; }
.compare-title { margin: 20px 0 10px; font-size: 15px; }
.opt { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 2px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.opt[aria-checked="true"] { border-color: var(--accent); }
.opt:disabled { cursor: not-allowed; opacity: .55; }
.opt .radio { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); }
.opt[aria-checked="true"] .radio { border: 6px solid var(--accent); }
.opt .pname { font-weight: 650; display: flex; align-items: center; gap: 6px; }
.opt .sub { font-size: 12px; color: var(--muted); }
.opt .sub .infl { color: var(--warn); font-weight: 600; }
.opt .total { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; text-align: right; }
.opt .badge { font-size: 11px; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 5px; font-weight: 600; }
.breakdown { font-size: 12px; color: var(--muted); grid-column: 2 / 4; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-variant-numeric: tabular-nums; }
.instore-ref { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; display: flex; justify-content: space-between; }
.cart-foot { padding: 16px; border-top: 1px solid var(--border); }
.checkout { width: 100%; border: 0; border-radius: 12px; padding: 14px; font-weight: 700; font-size: 16px; color: #fff; background: var(--accent); }
.checkout:disabled { opacity: .5; cursor: not-allowed; }
.savings { text-align: center; font-size: 13px; color: var(--accent); margin-top: 8px; min-height: 18px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; opacity: 0; transition: .2s; z-index: 40; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translateX(-50%); }
.note { font-size: 12px; color: var(--muted); text-align: center; padding: 0 0 32px; }
@media (max-width: 560px) {
  .addr-pill { display: none; }
  .item { grid-template-columns: 1fr; }
  .item .actions { justify-self: end; }
}
.fresh { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.fresh::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.fresh.live { color: var(--accent); font-weight: 600; }
.fresh.live::before { background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.fresh.stale { color: var(--warn); }
.fresh.stale::before { background: var(--warn); }
.item.stale .prices .price:not(.instore) { opacity: .6; }
.data-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; font-size: 13px; color: var(--muted); padding: 0 0 32px; }
.data-bar button, .data-bar label.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--text); }
.data-bar input[type=file] { display: none; }
.suburbs { display: flex; justify-content: center; gap: 8px; margin: 0 0 22px; flex-wrap: wrap; }
.suburbs span { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.cart-fresh { font-size: 12px; color: var(--muted); margin: -4px 0 12px; }
.members { display: flex; gap: 6px; margin-left: auto; }
.addr-pill:not([hidden]) + .members { margin-left: 0; }
.member { font-size: 13px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); white-space: nowrap; }
.member::before { content: "○ "; }
.member[aria-pressed="true"] { color: #fff; border-color: transparent; }
.member[aria-pressed="true"]::before { content: "✓ "; }
.member[data-member="doordash"][aria-pressed="true"] { background: var(--dd); }
.member[data-member="ubereats"][aria-pressed="true"] { background: #0b8a4c; }
.opt .member-note { color: var(--accent); font-weight: 600; }
@media (max-width: 560px) { .members { margin-left: auto !important; } .r-head > div:last-child { min-width: 0; flex: 1; } .r-head h2 { font-size: 21px; } .member { padding: 5px 8px; font-size: 12px; } .brand { font-size: 0; gap: 0; } .brand .dot { font-size: 13px; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <button class="brand" id="home"><span class="dot">$</span>PlatePricer</button>
    <button class="addr-pill" id="addrPill" hidden></button>
    <div class="members" role="group" aria-label="Memberships">
      <button class="member" data-member="doordash" aria-pressed="false" title="I have DashPass">DashPass</button>
      <button class="member" data-member="ubereats" aria-pressed="false" title="I have Uber One">Uber One</button>
    </div>
    <button class="cart-btn" id="cartBtn" aria-label="Open cart">Cart <span class="count" id="cartCount">0</span></button>
  </div>
</header>

<main class="wrap" id="app"></main>

<div class="scrim" id="scrim"></div>
<aside class="cart" id="cart" aria-label="Cart" aria-hidden="true">
  <div class="cart-head"><h2 id="cartTitle">Your cart</h2><button class="x" id="cartClose" aria-label="Close cart">×</button></div>
  <div class="cart-body" id="cartBody"></div>
  <div class="cart-foot">
    <button class="checkout" id="checkout" disabled>Choose a platform</button>
    <div class="savings" id="savings"></div>
  </div>
</aside>
<div class="toast" id="toast" role="status"></div>

<script>
/* ==================================================================
 * Config
 * ================================================================== */
const DATA_FILES = { restaurants: 'data/restaurants.csv', menu: 'data/menu.csv' };
const STALE_AFTER_DAYS = 14;   // manual prices older than this are flagged
const LIVE_WITHIN_MIN = 60;    // POS-synced prices newer than this read as "Live"

const PLATFORMS = {
  ubereats: { label: 'Uber Eats', short: 'UE', color: 'var(--ue)' },
  doordash: { label: 'DoorDash', short: 'DD', color: 'var(--dd)' },
  direct:   { label: 'Direct', short: 'Direct', color: 'var(--direct)' },
};
const PKEYS = Object.keys(PLATFORMS);

// Used when a fee column in restaurants.csv is left blank. These are placeholders:
// replace them with what you see in the apps. All fees are shown as estimates.
const DEFAULT_FEES = {
  ubereats: { delivery: 2.99, servicePct: 0.15, serviceMin: 2.00, smallOrder: 15, smallFee: 3.00 },
  doordash: { delivery: 2.99, servicePct: 0.15, serviceMin: 2.00, smallOrder: 15, smallFee: 3.00 },
  direct:   { delivery: 0,    servicePct: 0,    serviceMin: 0,    smallOrder: 0,  smallFee: 0 },
};

// Membership benefits applied when the toggle in the header is on. These are
// placeholders: check the current DashPass / Uber One terms in Australia and adjust.
const MEMBERSHIPS = {
  doordash: { name: 'DashPass', minOrder: 25, delivery: 0, servicePct: 0.05 },
  ubereats: { name: 'Uber One', minOrder: 25, delivery: 0, servicePct: 0.05 },
};

const CUISINE_STYLE = {
  Thai: ['🍜', 140], Vietnamese: ['🍲', 100], Italian: ['🍝', 4], Pizza: ['🍕', 10], Chinese: ['🥟', 0],
  Japanese: ['🍣', 350], Indian: ['🍛', 38], Burgers: ['🍔', 22], American: ['🍔', 22], BBQ: ['🍖', 15],
  Mexican: ['🌮', 28], Mediterranean: ['🥙', 200], Lebanese: ['🥙', 200], Greek: ['🥙', 210],
  Korean: ['🍱', 330], Cafe: ['☕', 30], Dessert: ['🍰', 320],
};
const styleFor = c => CUISINE_STYLE[c] || ['🍽️', 50];

/* ==================================================================
 * CSV loading
 * ==================================================================
 * The site reads two spreadsheets (exported as CSV) from data/:
 *   restaurants.csv  one row per restaurant (fees, links, source, date checked)
 *   menu.csv         one row per menu item (in-store, UE, DD and direct price)
 * If they're missing or empty, it shows the built-in demo data instead.
 * See README.md for the columns.
 */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const [header, ...body] = rows.filter(r => r.some(v => v.trim() !== ''));
  if (!header) return [];
  const keys = header.map(h => h.trim().toLowerCase());
  return body.map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] ?? '').trim()])));
}

const num = v => { if (v === undefined || v === '') return null; const n = parseFloat(String(v).replace(/[$,%\s]/g, '')); return Number.isFinite(n) ? n : null; };
const pctNum = v => { const n = num(v); return n === null ? null : (n > 1 ? n / 100 : n); };  // "15", "15%" or "0.15"
function parseDate(v) {
  if (!v) return null;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);           // 03/11/2026 (Australian day/month/year)
  const d = m ? new Date(+m[3], +m[2] - 1, +m[1]) : new Date(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v + 'T12:00' : v);
  return isNaN(d) ? null : d;
}

function restaurantsFromCSV(restRows, menuRows) {
  const byId = new Map();
  for (const r of restRows) {
    const id = r.restaurant_id || r.name;
    if (!id || !r.name) continue;
    const [emoji, hue] = styleFor(r.cuisine);
    const fees = {};
    for (const k of PKEYS) {
      const d = DEFAULT_FEES[k];
      fees[k] = {
        delivery: num(r[`${k}_delivery_fee`]) ?? d.delivery,
        servicePct: pctNum(r[`${k}_service_fee_pct`]) ?? d.servicePct,
        serviceMin: d.serviceMin, smallOrder: d.smallOrder, smallFee: d.smallFee,
        url: r[`${k}_url`] || '',
      };
    }
    byId.set(id, {
      id, name: r.name, suburb: r.suburb || '', cuisine: r.cuisine || 'Other', emoji, hue,
      tier: Math.min(4, Math.max(1, Math.round(num(r.price_tier) ?? (r.price_tier || '').length) || 2)),
      rating: num(r.rating), reviews: num(r.review_count),
      source: (r.price_source || 'manual').toLowerCase() === 'pos' ? 'pos' : 'manual',
      checkedAt: parseDate(r.last_checked), feesFrom: r.fees_checked_from || '',
      fees, platforms: {}, menu: [],
    });
  }
  const sections = new Map();
  for (const m of menuRows) {
    const r = byId.get(m.restaurant_id); const instore = num(m.instore_price);
    if (!r || !m.item || instore === null) continue;
    const key = r.id + '\u0000' + (m.section || 'Menu');
    if (!sections.has(key)) { const s = { section: m.section || 'Menu', items: [] }; sections.set(key, s); r.menu.push(s); }
    const s = sections.get(key);
    const prices = { instore };
    for (const k of PKEYS) prices[k] = num(m[`${k}_price`]);
    s.items.push({ id: `${r.id}::${s.section}::${s.items.length}`, name: m.item, desc: m.description || '', prices, checkedAt: parseDate(m.last_checked) });
  }
  return finalize([...byId.values()]);
}

// A restaurant is listed on a platform when at least one of its items has a price there.
function finalize(list) {
  for (const r of list) {
    for (const k of PKEYS) if (r.menu.some(s => s.items.some(it => it.prices[k] !== null))) r.platforms[k] = r.fees[k];
    for (const s of r.menu) for (const it of s.items) it.checkedAt = it.checkedAt || r.checkedAt;
  }
  return list.filter(r => r.menu.length);
}

/* ==================================================================
 * Demo data: fictional restaurants in Newtown, Enmore and Marrickville.
 * Names, prices and ratings are made up. Dates are relative to today so
 * the freshness labels always have something to show.
 * ================================================================== */
const DEMO_MENUS = {
  Thai: { Noodles: [['Pad Thai', 'Rice noodles, egg, peanuts, tamarind', 19.5], ['Pad See Ew', 'Wide noodles, Chinese broccoli', 19.5], ['Drunken Noodles', 'Thai basil, chilli', 20]],
          Curries: [['Green Curry', 'Coconut milk, Thai eggplant', 21], ['Massaman Beef', 'Slow-cooked, potato, peanut', 23]],
          Sides: [['Spring Rolls (4)', '', 9], ['Tom Yum Soup', 'Hot & sour', 10], ['Thai Iced Tea', '', 6]] },
  Vietnamese: { Pho: [['Beef Pho', 'Brisket, rare beef, herbs', 18.5], ['Chicken Pho', '', 17.5]],
          'Banh Mi': [['Pork Banh Mi', 'Crackling pork, pâté, pickles', 11], ['Lemongrass Chicken Banh Mi', '', 11]],
          Sides: [['Rice Paper Rolls (2)', 'Prawn & pork', 9.5], ['Vietnamese Iced Coffee', '', 6.5]] },
  Italian: { Pasta: [['Spaghetti Pomodoro', 'Tomato, garlic, basil', 22], ['Rigatoni Vodka', 'Creamy tomato, chilli', 26], ['Lasagne', 'Beef ragù, béchamel', 28]],

function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const r2 = n => Math.round(n * 100) / 100;
const to10c = n => Math.round(n * 10) / 10;

function demoRestaurants() {
  const rand = rng(20261109), pick = a => a[Math.floor(rand() * a.length)];
  const now = Date.now(), day = 864e5;
  return finalize(DEMO_RESTAURANTS.map(([name, suburb, cuisine, tier, source, ago], i) => {
    const [emoji, hue] = styleFor(cuisine);
    const mult = [0.9, 1, 1.15, 1.3][tier - 1];
    const ueMark = rand() > 0.1 ? 0.12 + rand() * 0.2 : null;
    const ddMark = rand() > 0.1 ? 0.10 + rand() * 0.22 : null;
    const directMark = rand() > 0.45 ? (rand() > 0.5 ? 0 : rand() * 0.05) : null;
    const checkedAt = source === 'pos' ? new Date(now - (2 + Math.floor(rand() * 20)) * 6e4) : new Date(now - ago * day);
    const fees = {
      ubereats: { ...DEFAULT_FEES.ubereats, delivery: pick([0.99, 1.99, 2.99, 3.99, 4.99]), url: '' },
      doordash: { ...DEFAULT_FEES.doordash, delivery: pick([0, 0.99, 1.99, 2.99, 3.99]), url: '' },
      direct:   { ...DEFAULT_FEES.direct, delivery: pick([0, 3, 5, 6.5]), url: '' },
    };
    const menu = Object.entries(DEMO_MENUS[cuisine]).map(([section, items]) => ({
      section,
      items: items.map(([n, d, base], j) => {
        const instore = Math.round(base * mult * 2) / 2;
        const mk = m => m === null ? null : (m === 0 ? instore : to10c(instore * (1 + Math.max(0, m + (rand() - 0.5) * 0.06))));
        return { id: `demo${i}::${section}::${j}`, name: n, desc: d, checkedAt: null,
                 prices: { instore, ubereats: mk(ueMark), doordash: mk(ddMark), direct: mk(directMark) } };
      }),
    }));
    return { id: `demo${i}`, name, suburb, cuisine, emoji, hue, tier,
             rating: r2(3.8 + rand() * 1.15), reviews: 30 + Math.floor(rand() * 1800),
             source, checkedAt, feesFrom: 'King St, Newtown', fees, platforms: {}, menu };
  }));
}

/* ==================================================================

 * ================================================================== */
const fmtDate = d => d.toLocaleDateString('en-AU', { day: 'numeric', month: 'short', ...(d.getFullYear() !== new Date().getFullYear() ? { year: 'numeric' } : {}) });
function ago(d) {
  const m = Math.max(0, Math.round((Date.now() - d) / 6e4));
  if (m < 1) return 'just now';
  if (m < 60) return `${m} min ago`;
  if (m < 1440) return `${Math.round(m / 60)} hr ago`;
  return `${Math.round(m / 1440)} days ago`;
}
// Returns { cls: 'live' | 'ok' | 'stale' | 'unknown', short, long }
function freshness(source, date) {
  if (!date) return { cls: 'unknown', short: 'Date unknown', long: 'Prices: date checked unknown' };
  const ageMin = (Date.now() - date) / 6e4;
  if (source === 'pos') {
    if (ageMin <= LIVE_WITHIN_MIN) return { cls: 'live', short: 'Live prices', long: `Live from restaurant · synced ${ago(date)}` };
    return { cls: ageMin > STALE_AFTER_DAYS * 1440 ? 'stale' : 'ok', short: `Synced ${ago(date)}`, long: `Synced from restaurant ${ago(date)}` };
  }
  if (ageMin > STALE_AFTER_DAYS * 1440) return { cls: 'stale', short: `Checked ${fmtDate(date)}`, long: `Prices checked ${fmtDate(date)} · may be out of date` };
  return { cls: 'ok', short: `Checked ${fmtDate(date)}`, long: `Prices checked ${fmtDate(date)}` };
}
const freshTag = f => `<span class="fresh ${f.cls}">${f.short}</span>`;

/* ==================================================================
 * Pricing engine (Australian menu prices include GST, so no tax line)
 * ================================================================== */
function quote(r, cart, platform) {
  const p = r.platforms[platform];
  if (!p) return { available: false, reason: 'Not on this platform' };
  let subtotal = 0, instore = 0; const missing = [];
  for (const line of cart.lines) {
    const it = findItem(r, line.itemId);
    instore += it.prices.instore * line.qty;
    if (it.prices[platform] === null) { missing.push(it.name); continue; }
    subtotal += it.prices[platform] * line.qty;
  }
  if (missing.length) return { available: false, reason: `Unavailable: ${missing.join(', ')}` };
  const mem = MEMBERSHIPS[platform], isMember = !!(mem && state.members[platform]);
  const memberApplied = isMember && subtotal >= mem.minOrder;
  const delivery = memberApplied ? mem.delivery : p.delivery;
  const servicePct = memberApplied ? Math.min(p.servicePct, mem.servicePct) : p.servicePct;
  const service = servicePct ? (memberApplied ? subtotal * servicePct : Math.max(p.serviceMin, subtotal * servicePct)) : 0;
  const small = subtotal < p.smallOrder ? p.smallFee : 0;
  const total = subtotal + delivery + service + small;
  return { available: true, subtotal: r2(subtotal), delivery, memberApplied, memberName: mem?.name,
           memberShortBy: isMember && !memberApplied ? r2(mem.minOrder - subtotal) : 0, service: r2(service), small: r2(small), total: r2(total),
           menuInflation: instore ? subtotal / instore - 1 : 0, totalInflation: instore ? total / instore - 1 : 0, url: p.url };
}
function avgMarkup(r) {
  const ms = [];
  for (const s of r.menu) for (const it of s.items) for (const k of ['ubereats', 'doordash']) if (it.prices[k] !== null) ms.push(it.prices[k] / it.prices.instore - 1);
  return ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0;
}
function platformMarkup(r, k) {
  const ms = [];
  for (const s of r.menu) for (const it of s.items) if (it.prices[k] !== null) ms.push(it.prices[k] / it.prices.instore - 1);
  return ms.length ? ms.reduce((a, b) => a + b, 0) / ms.length : 0;
}
function findItem(r, id) { for (const s of r.menu) for (const it of s.items) if (it.id === id) return it; return null; }

};

async function loadData() {
  // 1. Spreadsheets the user loaded in this browser
  const uploaded = store.get('uploadedCsv', null);
  if (uploaded) {
    const list = restaurantsFromCSV(parseCSV(uploaded.restaurants), parseCSV(uploaded.menu));
    if (list.length) return { list, source: 'uploaded' };
  }
  // 2. data/*.csv next to this page (works when the site is served, not opened as a file)
  if (location.protocol !== 'file:') try {
    const [a, b] = await Promise.all([fetch(DATA_FILES.restaurants), fetch(DATA_FILES.menu)]);
    if (a.ok && b.ok) {
      const list = restaurantsFromCSV(parseCSV(await a.text()), parseCSV(await b.text()));
      if (list.length) return { list, source: 'files' };
    }
  } catch {}
  // 3. Built-in demo
  return { list: demoRestaurants(), source: 'demo' };
}

async function init() {
  const { list, source } = await loadData();
  state.restaurants = list; state.dataSource = source;

}

function filteredRestaurants() {
  const f = state.filters;
  const list = state.restaurants.filter(r =>
    (f.cuisine === 'All' || r.cuisine === f.cuisine) &&
    (f.suburb === 'All' || r.suburb === f.suburb) &&
    (f.price === 'any' || r.tier === +f.price) &&
    (r.rating ?? 0) >= +f.rating);
  const sorters = {
    rating: (a, b) => (b.rating ?? 0) - (a.rating ?? 0),
    priceLow: (a, b) => a.tier - b.tier || (b.rating ?? 0) - (a.rating ?? 0),
    priceHigh: (a, b) => b.tier - a.tier || (b.rating ?? 0) - (a.rating ?? 0),
    markup: (a, b) => avgMarkup(a) - avgMarkup(b),
    fresh: (a, b) => (b.source === 'pos') - (a.source === 'pos') || (b.checkedAt || 0) - (a.checkedAt || 0),
  };
  return list.sort(sorters[f.sort]);
}

function cartFreshness(r) {
  // The oldest price in the cart decides how fresh the comparison is.
  const dates = state.cart.lines.map(l => findItem(r, l.itemId).checkedAt).filter(Boolean);
  const oldest = dates.length ? new Date(Math.min(...dates)) : null;
  const f = freshness(r.source, oldest);
  const menu = f.cls === 'live' ? 'Menu prices live' : f.cls === 'unknown' ? 'Menu prices: date unknown' : `Menu prices ${f.short.replace(/^Checked/, 'checked').replace(/^Synced/, 'synced')}`;
  return `<span class="fresh ${f.cls}">${menu}</span> · fees estimated`;
}

  const body = $('#cartBody'), btn = $('#checkout'), sav = $('#savings');
  const r = state.restaurants.find(x => x.id === cart.restaurantId);
  if (!r || !count) {
    $('#cartTitle').textContent = 'Your cart';
    body.innerHTML = '<p class="empty" style="padding:32px 0">Your cart is empty.<br>Add items from a restaurant to compare prices.</p>';
    btn.disabled = true; btn.textContent = 'Choose a platform'; btn.style.background = ''; sav.textContent = '';
    return;
  }
  $('#cartTitle').textContent = r.name;
  const quotes = Object.fromEntries(PKEYS.map(k => [k, quote(r, cart, k)]));
  const avail = PKEYS.filter(k => quotes[k].available).sort((a, b) => quotes[a].total - quotes[b].total);
  const cheapest = avail[0];
  if (!state.choice || !quotes[state.choice]?.available) state.choice = cheapest || null;
  const instore = cart.lines.reduce((a, l) => a + findItem(r, l.itemId).prices.instore * l.qty, 0);

  body.innerHTML = `
    ${cart.lines.map(l => { const it = findItem(r, l.itemId); return `<div class="line">
      <div class="qty"><button data-dec="${esc(it.id)}" aria-label="Remove one">−</button><b>${l.qty}</b><button data-inc="${esc(it.id)}" aria-label="Add one">+</button></div>
      <span style="flex:1">${esc(it.name)}</span><span>${money(it.prices.instore * l.qty)} <small style="color:var(--muted)">in-store</small></span></div>`; }).join('')}
    <h3 class="compare-title">Compare this cart</h3>
    <div class="cart-fresh">${cartFreshness(r)}</div>
    <div class="instore-ref"><span>In-store price</span><b>${money(r2(instore))}</b></div>
    <div role="radiogroup" aria-label="Ordering platform">
    ${[...avail, ...PKEYS.filter(k => !quotes[k].available)].map(k => {
      const q = quotes[k], P = PLATFORMS[k];
      if (!q.available) return `<button class="opt" disabled aria-checked="false"><span class="radio"></span>
        <div><div class="pname"><i class="swatch" style="background:${P.color}"></i>${P.label}</div><div class="sub">${esc(q.reason)}</div></div><div></div></button>`;
      return `<button class="opt" role="radio" data-choose="${k}" aria-checked="${state.choice === k}"><span class="radio"></span>
        <div><div class="pname"><i class="swatch" style="background:${P.color}"></i>${P.label} ${k === cheapest && avail.length > 1 ? '<span class="badge">Cheapest</span>' : ''}</div>
          <div class="sub"><span class="infl">${pct(q.totalInflation)}</span> vs. in-store · menu ${pct(q.menuInflation)}</div>
          ${q.memberApplied ? `<div class="sub member-note">✓ ${q.memberName} applied</div>` : q.memberShortBy ? `<div class="sub member-note">Add ${money(q.memberShortBy)} more for ${q.memberName} benefits</div>` : ''}</div>
        <div class="total">${money(q.total)}</div>
        <div class="breakdown">
          <span>Items</span><span>${money(q.subtotal)}</span>
          <span>Delivery${q.memberApplied ? ` (${q.memberName})` : ' (est.)'}</span><span>${q.delivery ? money(q.delivery) : 'Free'}</span>
          ${q.service ? `<span>Service fee${q.memberApplied ? ` (${q.memberName})` : ' (est.)'}</span><span>${money(q.service)}</span>` : ''}
          ${q.small ? `<span>Small-order fee (est.)</span><span>${money(q.small)}</span>` : ''}
        </div></button>`;
    }).join('')}
    </div>
    <p style="font-size:12px;color:var(--muted)">Prices include GST. Before tip. Fees change with your address and the time of day; check the total at checkout.</p>`;

  if (state.choice) {
    const q = quotes[state.choice], worst = Math.max(...avail.map(k => quotes[k].total));
    btn.disabled = false;
    btn.textContent = `Order via ${PLATFORMS[state.choice].label} · ${money(q.total)}`;
    btn.style.background = PLATFORMS[state.choice].color;
    sav.textContent = avail.length > 1 && worst - q.total > 0.005 ? `You save ${money(worst - q.total)} vs. the most expensive option` : '';
  } else {
    btn.disabled = true; btn.textContent = 'No platform has every item'; btn.style.background = ''; sav.textContent = '';
  }
}

/* ==================================================================
 * Actions
 * ================================================================== */
function setAddress(a) {
  state.address = a.trim(); store.set('address', state.address);
  state.view = 'browse'; render();
}
function changeQty(itemId, delta) {
  const rid = itemId.split('::')[0];
  if (state.cart.restaurantId && state.cart.restaurantId !== rid && delta > 0) {
    const other = state.restaurants.find(r => r.id === state.cart.restaurantId);
    if (!confirm(`Your cart has items from ${other.name}. Start a new cart?`)) return;
    state.cart = { restaurantId: null, lines: [] };
  }
  state.cart.restaurantId = rid;
  let line = state.cart.lines.find(l => l.itemId === itemId);
  if (!line) { line = { itemId, qty: 0 }; state.cart.lines.push(line); }
  line.qty += delta;
  state.cart.lines = state.cart.lines.filter(l => l.qty > 0);
  if (!state.cart.lines.length) state.cart.restaurantId = null;
  store.set('cart', state.cart);
  if (state.view === 'restaurant' && state.restaurantId === rid) { const y = scrollY; $('#app').innerHTML = restaurantView(state.restaurants.find(r => r.id === rid)); scrollTo(0, y); }
  renderCart();
}
function openCart(open) {
  $('#cart').classList.toggle('open', open); $('#scrim').classList.toggle('open', open);
  $('#cart').setAttribute('aria-hidden', String(!open));
}
async function loadCsvFiles(files) {
  const got = {};
  for (const f of files) {
    const text = await f.text();
    const header = (parseCSV(text.split(/\r?\n/).slice(0, 2).join('\n'))[0] || {});
    const cols = Object.keys(header);
    if (cols.includes('item') || cols.includes('instore_price')) got.menu = text;
    else if (cols.includes('name') || cols.includes('suburb')) got.restaurants = text;
  }
  const prev = store.get('uploadedCsv', {}) || {};
  const merged = { restaurants: got.restaurants || prev.restaurants, menu: got.menu || prev.menu };
  if (!merged.restaurants || !merged.menu) {
    if (got.restaurants || got.menu) store.set('uploadedCsv', merged);
    return toast(`Got ${got.menu ? 'menu' : 'restaurants'}.csv. Now load ${got.menu ? 'restaurants' : 'menu'}.csv too.`);
  }
  const list = restaurantsFromCSV(parseCSV(merged.restaurants), parseCSV(merged.menu));
  if (!list.length) return toast('No restaurants with menu items found. Check the column names against the template.');
  store.set('uploadedCsv', merged);
  state.restaurants = list; state.dataSource = 'uploaded';
  state.cart = { restaurantId: null, lines: [] }; store.set('cart', state.cart);
  state.filters = { ...state.filters, cuisine: 'All', suburb: 'All' };
  toast(`Loaded ${list.length} restaurant${list.length === 1 ? '' : 's'}.`); render();
}

document.addEventListener('submit', e => {
  if (e.target.id === 'addrForm') { e.preventDefault(); const v = $('#addrInput').value; if (v.trim()) setAddress(v); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'csvInput') { if (e.target.files.length) loadCsvFiles([...e.target.files]); return; }
  const k = e.target.dataset.filter; if (!k) return;
  state.filters[k] = e.target.value; $('#app').innerHTML = browseView();
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  if (t.id === 'home') { state.view = state.address ? 'browse' : 'landing'; render(); }
  else if (t.id === 'addrPill') { state.view = 'landing'; render(); }
  else if (t.dataset.member) {
    const k = t.dataset.member; state.members[k] = !state.members[k]; store.set('members', state.members); state.choice = null;
    renderMembers(); renderCart();
    if (state.view === 'restaurant') { const y = scrollY; $('#app').innerHTML = restaurantView(state.restaurants.find(r => r.id === state.restaurantId)); scrollTo(0, y); }
    toast(`${MEMBERSHIPS[k].name} ${state.members[k] ? 'on: $0 delivery and lower service fees on orders over ' + money(MEMBERSHIPS[k].minOrder) : 'off'}.`);
  }
  else if (t.id === 'cartBtn') openCart(true);
  else if (t.id === 'cartClose') openCart(false);
  else if (t.id === 'clearCsv') { store.set('uploadedCsv', undefined); await init(); toast('Removed uploaded data.'); }
  else if (t.dataset.cuisine) { state.filters.cuisine = t.dataset.cuisine; $('#app').innerHTML = browseView(); }
  else if (t.dataset.open) { state.view = 'restaurant'; state.restaurantId = t.dataset.open; render(); }
  else if (t.dataset.nav) { state.view = t.dataset.nav; render(); }
  else if (t.dataset.inc) changeQty(t.dataset.inc, 1);
  else if (t.dataset.dec) changeQty(t.dataset.dec, -1);
  else if (t.dataset.choose) { state.choice = t.dataset.choose; renderCart(); }
  else if (t.id === 'checkout' && state.choice) {
    const r = state.restaurants.find(x => x.id === state.cart.restaurantId);
    const url = r.platforms[state.choice]?.url;
    if (url && /^https?:\/\//i.test(url)) window.open(url, '_blank', 'noopener');
    else toast(`No ${PLATFORMS[state.choice].label} link for ${r.name} yet. Add one in restaurants.csv.`);
  }
});
$('#scrim').addEventListener('click', () => openCart(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape') openCart(false); });

init();
</script>
</body>
</html>
