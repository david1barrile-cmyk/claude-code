<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dinkum</title>
<meta name="description" content="Compare delivery prices across Uber Eats, DoorDash, ordering direct and picking up yourself.">
<style>
/* ------------------------------------------------------------------
 * Colour system
 * Brand: Carolina blue. It means "savings / cheapest" and nothing else.
 * Orange means "markup". Platforms are told apart by labelled badges,
 * never by colour alone (so Uber's green and DoorDash's red don't read
 * as good/bad, and colour-blind users lose nothing).
 * ------------------------------------------------------------------ */
:root {
  --bg: #f5f8fc; --surface: #ffffff; --surface-2: #ecf1f7; --text: #142033; --muted: #5a6577;
  --border: #dbe2ec; --brand: #4b9cd3; --brand-ink: #0f2547; --brand-soft: #e3effa; --brand-text: #1d5f96;
  --warn: #b0501a; --warn-soft: #fcefe6; --star: #c98d00; --shadow: 0 1px 2px rgba(16,34,64,.06), 0 6px 18px rgba(16,34,64,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1520; --surface: #162131; --surface-2: #1e2b3e; --text: #e7edf5; --muted: #9aa8bb;
    --border: #2a3a52; --brand: #4b9cd3; --brand-ink: #071528; --brand-soft: #16324f; --brand-text: #8cc4ec;
    --warn: #f19a60; --warn-soft: #3a2518; --star: #f2c14e; --shadow: 0 1px 2px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1520; --surface: #162131; --surface-2: #1e2b3e; --text: #e7edf5; --muted: #9aa8bb;
  --border: #2a3a52; --brand: #4b9cd3; --brand-ink: #071528; --brand-soft: #16324f; --brand-text: #8cc4ec;
  --warn: #f19a60; --warn-soft: #3a2518; --star: #f2c14e; --shadow: 0 1px 2px rgba(0,0,0,.35);
  color-scheme: dark;
}
/* High contrast: stronger text, borders and markup colour */
:root[data-contrast="high"] { --muted: #2f3a4b; --border: #7d8a9e; --brand-text: #0f4677; --warn: #8a3a0c; }
@media (prefers-color-scheme: dark) {
  :root[data-contrast="high"]:not([data-theme="light"]) { --muted: #d3dbe6; --border: #8193ad; --brand-text: #b5dcf7; --warn: #ffb88a; --text: #ffffff; }
}
:root[data-theme="dark"][data-contrast="high"] { --muted: #d3dbe6; --border: #8193ad; --brand-text: #b5dcf7; --warn: #ffb88a; --text: #ffffff; }

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--brand-text); }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Header */
header.top { position: sticky; top: 0; z-index: 30; background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
header.top .wrap { display: flex; align-items: center; gap: 8px; height: 60px; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; margin-right: auto; }
.brand .dot { width: 26px; height: 26px; border-radius: 8px; background: var(--brand); display: inline-grid; place-items: center; color: var(--brand-ink); font-size: 14px; font-weight: 800; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); white-space: nowrap; font-size: 14px; }
.addr-pill { max-width: 28vw; overflow: hidden; text-overflow: ellipsis; display: block; }
.member { font-size: 13px; color: var(--muted); }
.member::before { content: "○"; }
.member[aria-pressed="true"] { background: var(--brand-soft); border-color: var(--brand); color: var(--brand-text); font-weight: 600; }
.member[aria-pressed="true"]::before { content: "✓"; }
.icon-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; font-size: 17px; padding: 0; }
.cart-btn { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 0; background: var(--text); color: var(--bg); font-weight: 600; }
.cart-btn .count { background: var(--brand); color: var(--brand-ink); border-radius: 999px; min-width: 20px; padding: 0 6px; font-size: 12px; text-align: center; font-weight: 700; }

/* Buttons */
.btn { border: 0; border-radius: 10px; padding: 10px 18px; font-weight: 700; background: var(--brand); color: var(--brand-ink); }
.btn.secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.link-btn { background: none; border: 0; padding: 0; color: var(--brand-text); font-weight: 600; font-size: 13px; }

/* Platform badges */
.pb { display: inline-flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; letter-spacing: .02em; padding: 1px 5px; border-radius: 4px; line-height: 1.35; flex: none; }
.pb.ubereats { background: var(--text); color: var(--bg); border: 1.5px solid var(--text); }
.pb.doordash { background: transparent; color: var(--text); border: 1.5px solid var(--text); }
.pb.direct { background: var(--surface-2); color: var(--text); border: 1.5px dashed var(--muted); }
.pb.pickup { background: var(--brand-soft); color: var(--brand-text); border: 1.5px solid var(--brand); }

/* Landing + onboarding */
.hero { padding: 64px 0 48px; text-align: center; }
.hero h1 { font-size: clamp(30px, 5vw, 50px); line-height: 1.08; letter-spacing: -.025em; margin: 0 0 14px; }
.hero h1 em { font-style: normal; color: var(--brand-text); }
.hero p { color: var(--muted); max-width: 560px; margin: 0 auto 28px; font-size: 17px; }
.addr-form { display: flex; gap: 8px; max-width: 580px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 6px; box-shadow: var(--shadow); }
.addr-form { position: relative; }
.suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 25; margin: 0; padding: 6px; list-style: none; text-align: left;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-height: 340px; overflow-y: auto; }
.suggest li[role="option"] { display: flex; flex-direction: column; gap: 1px; padding: 9px 10px; border-radius: 10px; cursor: pointer; }
.suggest li[aria-selected="true"], .suggest li[role="option"]:hover { background: var(--brand-soft); }
.sug-main { font-weight: 600; }
.sug-sub { font-size: 12px; color: var(--muted); padding-left: 22px; }
.sug-credit { font-size: 11px; color: var(--muted); padding: 6px 10px 2px; text-align: right; }
.addr-form input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 10px 12px; outline: none; }
.suburbs { display: flex; justify-content: center; gap: 8px; margin: 0 0 22px; flex-wrap: wrap; }
.suburbs span { font-size: 13px; padding: 4px 12px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-text); font-weight: 600; }
.saved-addrs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 14px; }
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; max-width: 900px; margin: 44px auto 0; text-align: left; }
.how div { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; font-size: 14px; color: var(--muted); }
.how b { display: block; color: var(--text); margin-bottom: 2px; font-size: 15px; }
.panel { max-width: 520px; margin: 48px auto; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 24px; box-shadow: var(--shadow); }
.panel h2 { margin: 0 0 4px; font-size: 22px; }
.check { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--border); border-radius: 12px; margin-top: 10px; cursor: pointer; }
.check input { width: 18px; height: 18px; accent-color: var(--brand); }
.check small { display: block; color: var(--muted); }

/* Browse */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 20px 0 8px; }
.search { flex: 1 1 260px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 0 12px; }
.search input { flex: 1; border: 0; background: transparent; padding: 10px 0; outline: none; min-width: 0; }
.ctl { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
.ctl select { padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 7px 12px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 8px 0 14px; scrollbar-width: none; }
.chip { flex: none; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); font-size: 14px; }
.chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.results-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 6px 0 12px; }
.results-head h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; padding-bottom: 32px; }
.card { position: relative; display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); transition: transform .12s; }
.card:hover { transform: translateY(-2px); }
.card .open { all: unset; cursor: pointer; display: flex; flex-direction: column; flex: 1; }
.card .open:focus-visible { outline: 3px solid var(--brand); outline-offset: -3px; border-radius: 16px; }
.photo-wrap { position: relative; flex: none; }
.photo { height: 150px; background-size: cover; background-position: center; }
.photo.pattern { display: grid; place-items: center; }
.photo.pattern span { font-size: 52px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); }
.save-badge { position: absolute; left: 10px; top: 10px; display: inline-flex; gap: 6px; align-items: center; background: var(--brand); color: var(--brand-ink);
  font-weight: 800; font-size: 14px; padding: 5px 10px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
.save-badge .pb { background: var(--brand-ink); color: #fff; border-color: var(--brand-ink); }
.save-badge.pick .pb { background: var(--brand-ink); color: #fff; border-color: var(--brand-ink); }
.save-badge.none { background: rgba(10,18,30,.72); color: #fff; font-weight: 700; font-size: 13px; }
.deal-chip { position: absolute; right: 10px; bottom: 10px; display: inline-flex; gap: 4px; align-items: center; background: var(--warn); color: #fff; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 7px; }
:root[data-theme="dark"] .deal-chip { color: #1a0d05; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .deal-chip { color: #1a0d05; } }
.sp-chip { position: absolute; left: 10px; bottom: 10px; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; background: rgba(10,18,30,.72); color: #fff; padding: 3px 8px; border-radius: 6px; }
.card .body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
.titlerow { display: flex; align-items: baseline; gap: 8px; }
.card h3 { margin: 0; font-size: 16px; flex: 1; min-width: 0; }
.rating { font-weight: 700; font-size: 14px; white-space: nowrap; }
.iconrow { display: flex; gap: 10px; color: var(--muted); font-size: 13px; align-items: center; white-space: nowrap; min-width: 0; }
.iconrow > span { display: inline-flex; gap: 4px; align-items: center; flex: none; }
.iconrow > span:first-child { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: block; }
.ico { width: 14px; height: 14px; flex: none; }
.fresh-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.fresh-dot.live { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.fresh-dot.stale { background: var(--warn); }
.meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: center; }
.star { color: var(--star); }
.best-line { font-size: 13px; background: var(--brand-soft); color: var(--brand-text); border-radius: 8px; padding: 6px 8px; font-weight: 600; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.best-line.none { background: var(--surface-2); color: var(--muted); font-weight: 500; }
.card-foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin-top: auto; padding-top: 4px; }
.tag { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.tag.deal { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.fav { color: var(--muted); border: 0; background: none; padding: 2px; line-height: 1; }
.fav svg { width: 20px; height: 20px; display: block; }
.fav[aria-pressed="true"] { color: #e0457b; }
.card > .fav { position: absolute; top: 10px; right: 10px; width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.92); color: #142033; display: grid; place-items: center; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
.card > .fav svg { width: 18px; height: 18px; }
.card > .fav[aria-pressed="true"] { color: #e0457b; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; grid-column: 1 / -1; }
.dishes { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 20px; overflow: hidden; }
.dish { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--border); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
.dish:last-child { border-bottom: 0; }
.dish .right { text-align: right; font-variant-numeric: tabular-nums; }
#map { height: 520px; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 32px; z-index: 0; }
.map-pop { font: 13px/1.4 system-ui, sans-serif; min-width: 180px; }
.map-pop b { font-size: 14px; }
.data-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 14px; font-size: 13px; color: var(--muted); padding: 0 0 32px; }
.data-bar button, .data-bar label.mini { border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer; color: var(--text); }
.data-bar input[type=file] { display: none; }

/* Freshness */
.fresh { font-size: 12px; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
.fresh::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.fresh.live { color: var(--brand-text); font-weight: 600; }
.fresh.live::before { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.fresh.stale { color: var(--warn); }
.fresh.stale::before { background: var(--warn); }

/* Restaurant */
.back { background: none; border: 0; color: var(--muted); padding: 16px 0 0; }
.r-head { display: flex; gap: 16px; align-items: center; padding: 12px 0 16px; }
.r-head .logo { width: 84px; height: 84px; border-radius: 18px; display: grid; place-items: center; font-size: 42px; flex: none; background-size: cover; background-position: center; }
.r-head .info { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 4px; }
.r-head h2 { margin: 0; font-size: 26px; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px; }
.r-head h2 .fav { position: static; }
.ratings { display: flex; flex-wrap: wrap; gap: 6px; }
.ratings span { font-size: 12px; background: var(--surface-2); border-radius: 6px; padding: 2px 8px; }
.summary { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
.summary h3 { margin: 0 0 2px; font-size: 15px; }
.summary .opts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.summary .o { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); font-variant-numeric: tabular-nums; font-size: 14px; }
.summary .o.best { border-color: var(--brand); background: var(--brand-soft); font-weight: 700; }
.summary .o.na { opacity: .55; font-size: 12px; }
.deals { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.deal-row { display: flex; gap: 8px; align-items: center; font-size: 13px; background: var(--warn-soft); border-radius: 10px; padding: 8px 10px; }
.deal-row .why { margin-left: auto; color: var(--muted); font-size: 12px; text-align: right; }
details.fees { margin-bottom: 8px; }
details.fees summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
.fee-wrap { overflow-x: auto; }
.fee-table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin: 6px 0 10px; }
.fee-table th, .fee-table td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
.fee-table th:first-child, .fee-table td:first-child { text-align: left; }
.fee-table tr:last-child td { border-bottom: 0; }
.menu-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0 4px; }
.menu-tools .grow { flex: 1; }
.toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; }
.toggle input { accent-color: var(--brand); width: 16px; height: 16px; }
.menu-section h3 { font-size: 17px; margin: 22px 0 10px; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; scroll-margin-top: 80px; }
.item.flash { animation: flash 1.6s; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--brand); } 100% { box-shadow: none; } }
.item .thumb { width: 56px; height: 56px; border-radius: 10px; background-size: cover; background-position: center; }
.item .thumb.none { display: none; }
.item.no-thumb { grid-template-columns: 1fr auto; }
.item .name { font-weight: 650; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.diet { font-size: 10.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.item .desc { color: var(--muted); font-size: 13px; margin: 2px 0 8px; }
.prices { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.price { font-size: 13px; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--border); display: inline-flex; gap: 6px; align-items: center; font-variant-numeric: tabular-nums; }
.price b { font-weight: 700; }
.price.instore { background: var(--surface-2); }
.price .pct { font-size: 11px; color: var(--warn); font-weight: 600; }
.price.best { border-color: var(--brand); background: var(--brand-soft); }
.price.na { opacity: .55; }
.item.stale .price:not(.instore) { opacity: .6; }
.add { border: 0; background: var(--text); color: var(--bg); border-radius: 999px; width: 38px; height: 38px; font-size: 20px; line-height: 1; }
.qty { display: flex; align-items: center; gap: 8px; }
.qty button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); }

/* Profile */
.profile { max-width: 760px; margin: 0 auto; padding: 8px 0 48px; }
.profile section { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; margin-top: 16px; }
.profile h3 { margin: 0 0 8px; font-size: 16px; }
.profile .row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.profile .row:last-child { border-bottom: 0; }
.profile .row .grow { flex: 1; min-width: 0; }
.big-number { font-size: 34px; font-weight: 800; color: var(--brand-text); letter-spacing: -.02em; }

/* Cart drawer */
.scrim { position: fixed; inset: 0; background: rgba(5,15,30,.4); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 40; }
.scrim.open { opacity: 1; pointer-events: auto; }
aside.cart { position: fixed; top: 0; right: 0; bottom: 0; width: min(450px, 100%); background: var(--bg); border-left: 1px solid var(--border); z-index: 41; transform: translateX(100%); transition: transform .2s; display: flex; flex-direction: column; visibility: hidden; }
aside.cart.open { transform: none; visibility: visible; }
.cart-head { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 1px solid var(--border); }
.cart-head h2 { margin: 0; font-size: 19px; }
.x { border: 0; background: none; font-size: 24px; color: var(--muted); }
.cart-body { flex: 1; overflow-y: auto; padding: 16px; }
.line { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
.line .qty button { width: 26px; height: 26px; font-size: 13px; }
.compare-title { margin: 18px 0 6px; font-size: 15px; }
.cart-fresh { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

<script>
/* ==================================================================
 * Config
 * ================================================================== */
// Working name. Changing it here updates the header, tab title and home label.
const APP_NAME = 'Dinkum';
document.title = APP_NAME;

document.querySelector('#home .dot').textContent = APP_NAME[0];
document.querySelector('#home').setAttribute('aria-label', APP_NAME + ' home');

// 'live' reads only real data (the Google Sheet, then data/ files). 'demo' shows only made-up data.
// demo.html is a copy of this file with DATA_MODE set to 'demo' (run ./make-demo.sh after editing).
const DATA_MODE = 'demo';
const DATA_FILES = { restaurants: 'data/restaurants.csv', menu: 'data/menu.csv', modifiers: 'data/modifiers.csv', promotions: 'data/promotions.csv', sponsors: 'data/sponsors.csv' };
// Google Sheet with tabs named restaurants, menu, modifiers, promotions and sponsors. The sheet must be shared as
// "Anyone with the link: Viewer". Everything in these tabs is public, so keep private notes elsewhere.
const GOOGLE_SHEET_ID = '1qpm1Jf8LGJDo-gPqjRYV9fVIO8zGZjNc0pZ6DeTTXYo';
const sheetCsvUrl = tab => `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
// Google Form for "Wrong price?" reports. Make a pre-filled link with these placeholder answers:
// RESTAURANT, ITEM, WHERE, SHOWN, SEEN, NOTE, and paste it here. Leave empty to skip.
const REPORT_FORM_PREFILL_URL = '';
// Traffic analytics. Fill in one (or both) to switch tracking on. See README "Traffic".
const ANALYTICS = { plausibleDomain: '', ga4MeasurementId: '' };
// Where "Advertise on Dinkum" points (a Google Form, email link or page). Leave empty to hide the link.
const ADVERTISE_URL = '';
// Address search as you type. With a Google Maps key, suggestions come from Google Places; without one,
// from OpenStreetMap (Photon). If neither can be reached, from a built-in list of local streets and suburbs.
// Restrict the key in Google Cloud to your website's address and to "Places API (New)" + "Maps JavaScript API":
// it is visible in the page source by design.
const GOOGLE_MAPS_API_KEY = '';
const SEARCH_CENTRE = { lat: -33.9010, lng: 151.1700 };   // bias suggestions towards the inner west
const STALE_AFTER_DAYS = 14;   // manual prices older than this are flagged
// Where "Wrong price?" reports are emailed. The report opens in the user's own email app, addressed here.
// Leave empty to only save reports on the device. Note: anything here is visible to anyone who views the page source.
const REPORT_EMAIL = '';
const CONFIRM_WINDOW_HOURS = 24;  // after this, an unanswered order counts as an estimate only
const LIVE_WITHIN_MIN = 60;    // POS-synced prices newer than this read as "Live"
const RATING_PRIOR = { mean: 4.2, weight: 50 };  // so a 4.9 from 12 reviews doesn't outrank a 4.6 from 2,000

const PLATFORMS = {
  ubereats: { label: 'Uber Eats', short: 'UE' },
  doordash: { label: 'DoorDash', short: 'DD' },
  direct:   { label: 'Direct', short: 'Direct' },
};
const PKEYS = Object.keys(PLATFORMS);
const badge = k => `<span class="pb ${k}" aria-hidden="true">${k === 'pickup' ? 'Pickup' : PLATFORMS[k].short}</span>`;

// Used when a fee column in restaurants.csv is blank. Placeholders: replace with what you see in the apps.
const DEFAULT_FEES = {
  ubereats: { delivery: 2.99, servicePct: 0.15, serviceMin: 2.00, smallOrder: 15, smallFee: 3.00, radius: 6 },
  doordash: { delivery: 2.99, servicePct: 0.15, serviceMin: 2.00, smallOrder: 15, smallFee: 3.00, radius: 6 },
  direct:   { delivery: 0,    servicePct: 0,    serviceMin: 0,    smallOrder: 0,  smallFee: 0,    radius: 3 },
};
// Membership benefits (placeholders: check current Australian terms).
const MEMBERSHIPS = {
  doordash: { name: 'DashPass', minOrder: 25, delivery: 0, servicePct: 0.05 },
  ubereats: { name: 'Uber One', minOrder: 25, delivery: 0, servicePct: 0.05 },
};
// Approximate suburb centres, used when an address can't be geocoded.
const SUBURBS = {
  Newtown: [-33.8968, 151.1785], Enmore: [-33.9007, 151.1737], Marrickville: [-33.9115, 151.1555],
  Stanmore: [-33.8940, 151.1640], Erskineville: [-33.9020, 151.1860], Camperdown: [-33.8880, 151.1770],
  Petersham: [-33.8945, 151.1550], 'Dulwich Hill': [-33.9050, 151.1390], 'St Peters': [-33.9100, 151.1800],
  Sydenham: [-33.9160, 151.1670], Tempe: [-33.9230, 151.1600], Lewisham: [-33.8960, 151.1470],
};
const CUISINE_STYLE = {
  Thai: ['🍜', 140], Vietnamese: ['🍲', 100], Italian: ['🍝', 4], Pizza: ['🍕', 10], Chinese: ['🥟', 0],
  Japanese: ['🍣', 350], Indian: ['🍛', 38], Burgers: ['🍔', 22], American: ['🍔', 22], BBQ: ['🍖', 15],
  Mexican: ['🌮', 28], Mediterranean: ['🥙', 200], Lebanese: ['🥙', 200], Greek: ['🥙', 210],
  Korean: ['🍱', 330], Cafe: ['☕', 30], Dessert: ['🍰', 320],
};
const styleFor = c => CUISINE_STYLE[c] || ['🍽️', 210];
const DIETS = { vegetarian: 'V', vegan: 'VG', 'gluten-free': 'GF', spicy: '🌶' };

/* ==================================================================
 * CSV helpers
 * ================================================================== */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = (text || '').replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (c === '"') q = false;
      else cell += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  const [header, ...body] = rows.filter(r => r.some(v => v.trim() !== ''));
  if (!header) return [];
  const keys = header.map(h => h.trim().toLowerCase());
  return body.map(r => Object.fromEntries(keys.map((k, i) => [k, (r[i] ?? '').trim()])));
}
const num = v => { if (v === undefined || v === null || v === '') return null; const n = parseFloat(String(v).replace(/[$,%\s]/g, '')); return Number.isFinite(n) ? n : null; };
const pctNum = v => { const n = num(v); return n === null ? null : (n > 1 ? n / 100 : n); };
const yes = v => /^(y|yes|true|1)$/i.test(String(v || '').trim());
function parseDate(v) {
  if (!v) return null;
  const m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v);
  const d = m ? new Date(+m[3], +m[2] - 1, +m[1]) : new Date(/^\d{4}-\d{2}-\d{2}$/.test(v) ? v + 'T12:00' : v);
  return isNaN(d) ? null : d;
}

function restaurantsFromCSV(restRows, menuRows, modRows = []) {
  const byId = new Map();
  for (const r of restRows) {
    const id = r.restaurant_id || r.name;
    if (!id || !r.name) continue;
    const [emoji, hue] = styleFor(r.cuisine);
    const fees = {};
    for (const k of PKEYS) {
      const d = DEFAULT_FEES[k];
      fees[k] = {
        delivery: num(r[`${k}_delivery_fee`]) ?? d.delivery,
        servicePct: pctNum(r[`${k}_service_fee_pct`]) ?? d.servicePct,
        serviceMin: d.serviceMin, smallOrder: d.smallOrder, smallFee: d.smallFee,
        radius: num(r[`${k}_radius_km`]) ?? d.radius,
        url: r[`${k}_url`] || '',
      };
    }
    const ratings = [];
    const g = num(r.google_rating) ?? num(r.rating);
    if (g !== null) ratings.push({ src: 'Google', rating: g, count: num(r.google_reviews) ?? num(r.review_count) });
    if (num(r.ubereats_rating) !== null) ratings.push({ src: 'Uber Eats', rating: num(r.ubereats_rating), count: num(r.ubereats_reviews) });
    if (num(r.doordash_rating) !== null) ratings.push({ src: 'DoorDash', rating: num(r.doordash_rating), count: num(r.doordash_reviews) });
    let lat = num(r.lat), lng = num(r.lng);
    if ((lat === null || lng === null) && SUBURBS[r.suburb]) [lat, lng] = SUBURBS[r.suburb];
    byId.set(id, {
      id, name: r.name, suburb: r.suburb || '', address: r.address || '', cuisine: r.cuisine || 'Other', emoji, hue,
      photo: r.photo_url || '', lat, lng, pickup: r.pickup === '' || r.pickup === undefined ? true : yes(r.pickup),
      tier: Math.min(4, Math.max(1, Math.round(num(r.price_tier) ?? (r.price_tier || '').length) || 2)),
      ratings, source: (r.price_source || 'manual').toLowerCase() === 'pos' ? 'pos' : 'manual',
      checkedAt: parseDate(r.last_checked), feesFrom: r.fees_checked_from || '',
      fees, platforms: {}, menu: [],
    });
  }
  const sections = new Map();
  for (const m of menuRows) {
    const r = byId.get(m.restaurant_id); const instore = num(m.instore_price);
    if (!r || !m.item || instore === null) continue;
    const key = r.id + '\u0000' + (m.section || 'Menu');
    if (!sections.has(key)) { const s = { section: m.section || 'Menu', items: [] }; sections.set(key, s); r.menu.push(s); }
    const s = sections.get(key);
    const prices = { instore };
    for (const k of PKEYS) prices[k] = num(m[`${k}_price`]);
    const tags = (m.tags || '').toLowerCase().split(/[;|,]/).map(t => t.trim()).filter(t => DIETS[t]);
    s.items.push({ id: `${r.id}::${s.section}::${s.items.length}`, name: m.item, desc: m.description || '', prices, tags, photo: m.photo_url || '', checkedAt: parseDate(m.last_checked), groups: [] });
  }
  for (const m of modRows) {
    const r = byId.get(m.restaurant_id); if (!r || !m.group || !m.option) continue;
    const prices = { instore: num(m.instore_price) ?? 0 };
    for (const k of PKEYS) prices[k] = num(m[`${k}_price`]);
    addModifier(r, (m.applies_to || 'all').trim(), m.group, m.option, yes(m.required), (m.choose || '').toLowerCase(), prices, parseDate(m.last_checked));
  }
  return finalize([...byId.values()]);
}
function promotionsFromCSV(rows) {
  return rows.filter(p => p.restaurant_id && PKEYS.includes((p.platform || '').toLowerCase())).map(p => ({
    restaurantId: p.restaurant_id, platform: p.platform.toLowerCase(), type: (p.type || 'percent').toLowerCase(),
    value: num(p.value) ?? 0, minOrder: num(p.min_order) ?? 0, maxDiscount: num(p.max_discount),
    item: p.item || '', membersOnly: yes(p.members_only), newOnly: yes(p.new_customers_only),
    starts: parseDate(p.starts), ends: parseDate(p.ends), desc: p.description || '',
  }));
}
// Attach one modifier option to every item it applies to: an item name, "section:Name" or "all".
function addModifier(r, appliesTo, groupName, optionName, required, choose, prices, checkedAt) {
  const target = appliesTo.toLowerCase();
  for (const s of r.menu) for (const it of s.items) {
    const hit = target === 'all' || target === '*' || (target.startsWith('section:') && target.slice(8).trim() === s.section.toLowerCase()) || target === it.name.toLowerCase();
    if (!hit) continue;
    let g = it.groups.find(x => x.name.toLowerCase() === groupName.toLowerCase());
    if (!g) { g = { name: groupName, required: false, multi: null, options: [] }; it.groups.push(g); }
    if (required) g.required = true;
    if (choose === 'one' || choose === 'many') g.multi = choose === 'many';
    if (g.options.some(o => o.name.toLowerCase() === optionName.toLowerCase())) continue;
    g.options.push({ id: `${it.id}::o${it.groups.indexOf(g)}.${g.options.length}`, name: optionName, prices: { ...prices }, checkedAt });
  }
}
function sponsorsFromCSV(rows) {
  const list = s => (s || '').split(/[;|]/).map(x => x.trim()).filter(Boolean);

    id: r.sponsor_id, placement: r.placement.toLowerCase(), restaurantId: r.restaurant_id || '', advertiser: r.advertiser || '',
    headline: r.headline || '', body: r.body || '', image: r.image_url || '', link: r.link_url || '', cta: r.cta || '',
    suburbs: list(r.suburbs), cuisines: list(r.cuisines), starts: parseDate(r.starts), ends: parseDate(r.ends),
    active: !/^(n|no|false|0|paused)$/i.test((r.active || '').trim()),
  }));
}
function finalize(list) {
  for (const r of list) for (const s of r.menu) for (const it of s.items) {
    it.groups = it.groups || [];
    for (const g of it.groups) if (g.multi === null) g.multi = !g.required;   // default: required = pick one, optional = tick several
  }
  for (const r of list) {
    for (const k of PKEYS) if (r.menu.some(s => s.items.some(it => it.prices[k] !== null))) r.platforms[k] = r.fees[k];
    for (const s of r.menu) for (const it of s.items) it.checkedAt = it.checkedAt || r.checkedAt;
  }
  return list.filter(r => r.menu.length);
}

async function fetchCsvSet(urls) {
  const get = u => fetch(u, { cache: 'no-store' }).then(r => r.ok ? r.text() : '').catch(() => '');
  const [a, b, c, d, e] = await Promise.all([get(urls.restaurants), get(urls.menu), get(urls.promotions), get(urls.sponsors), get(urls.modifiers)]);
  if (!a || !b) return null;
  const list = restaurantsFromCSV(parseCSV(a), parseCSV(b), parseCSV(e));
  return list.length ? { list, promos: promotionsFromCSV(parseCSV(c)), sponsors: sponsorsFromCSV(parseCSV(d)) } : null;
}
async function loadData() {

function distKm(a, b) {

  const R = 6371, rad = x => x * Math.PI / 180;

  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

    <div class="radios" style="margin-top:8px">${[['ubereats', 'Uber Eats'], ['doordash', 'DoorDash'], ['', 'It varies']].map(([v, l]) => `<label><input type="radio" name="usual" value="${v}" ${profile.usualApp === v ? 'checked' : ''}> ${l}</label>`).join('')}</div>
    <div style="display:flex;gap:10px;margin-top:18px"><button class="btn" type="submit">Show restaurants</button></div>
  </form>`;
}

function filteredRestaurants() {
  const f = state.filters, q = f.q.trim().toLowerCase();
  const list = state.restaurants.filter(r =>
    (f.cuisine === 'All' || r.cuisine === f.cuisine) &&
    (f.suburb === 'All' || r.suburb === f.suburb) &&
    (f.price === 'any' || r.tier === +f.price) &&
    (combinedRating(r).rating ?? 0) >= +f.rating &&
    (!f.favs || isFav(r)) && (!f.deals || userDeals(r).length) &&
    (!q || r.name.toLowerCase().includes(q) || r.cuisine.toLowerCase().includes(q) || r.menu.some(s => s.items.some(it => it.name.toLowerCase().includes(q)))));
  const cheapest = r => { const b = bestWay(r); return b.best ? b.quotes[b.best].total : Infinity; };
  const sorters = {
    best: (a, b) => rankScore(b) - rankScore(a),
    cheapest: (a, b) => cheapest(a) - cheapest(b),
    closest: (a, b) => (distTo(a) ?? 99) - (distTo(b) ?? 99),
    priceLow: (a, b) => a.tier - b.tier || rankScore(b) - rankScore(a),
    priceHigh: (a, b) => b.tier - a.tier || rankScore(b) - rankScore(a),
    fresh: (a, b) => (b.source === 'pos') - (a.source === 'pos') || (b.checkedAt || 0) - (a.checkedAt || 0),
  };
  return list.sort(sorters[f.sort]);
}

function browseView() {
  const f = state.filters;
  const opt = (v, l, cur) => `<option value="${esc(v)}" ${cur === String(v) ? 'selected' : ''}>${esc(l)}</option>`;
  const cuisines = ['All', ...[...new Set(state.restaurants.map(r => r.cuisine))].sort()];
  return `<div class="toolbar">
      <label class="search"><span aria-hidden="true">🔍</span><span class="sr">Search</span>
        <input id="search" type="search" placeholder="Search dishes or restaurants, e.g. pad thai" value="${esc(f.q)}"></label>
      <label class="ctl">Sort <select data-filter="sort">${[['best', 'Top rated'], ['cheapest', 'Cheapest to order'], ['closest', 'Closest'], ['priceLow', 'Price: $ to $$$$'], ['priceHigh', 'Price: $$$$ to $'], ['fresh', 'Freshest prices']].map(([v, l]) => opt(v, l, f.sort)).join('')}</select></label>
      <label class="ctl">Suburb <select data-filter="suburb">${opt('All', 'All', f.suburb)}${suburbs().map(s => opt(s, s, f.suburb)).join('')}</select></label>
      <label class="ctl">Price <select data-filter="price">${opt('any', 'Any', f.price)}${[1, 2, 3, 4].map(t => opt(t, dollars(t), f.price)).join('')}</select></label>
      <label class="ctl">Rating <select data-filter="rating">${[['0', 'Any'], ['4', '4.0+'], ['4.5', '4.5+']].map(([v, l]) => opt(v, l, f.rating)).join('')}</select></label>
      <div class="seg" role="group" aria-label="View"><button data-layout="list" aria-pressed="${state.layout === 'list'}">List</button><button data-layout="map" aria-pressed="${state.layout === 'map'}">Map</button></div>
    </div>
    <div class="chips" role="toolbar" aria-label="Filters">
      <button class="chip" data-toggle-filter="favs" aria-pressed="${f.favs}">♥ Favourites</button>
      <button class="chip" data-toggle-filter="deals" aria-pressed="${f.deals}">🏷 Deals</button>
      ${cuisines.map(c => `<button class="chip" data-cuisine="${esc(c)}" aria-pressed="${f.cuisine === c}">${c === 'All' ? 'All cuisines' : styleFor(c)[0] + ' ' + esc(c)}</button>`).join('')}
    </div>

}

function renderResults() {
  const el = $('#results'); if (!el) return;
  if (!state.restaurants.length) { el.innerHTML = emptyState(); return; }
  const list = filteredRestaurants(), q = state.filters.q.trim().toLowerCase();
  const head = `<div class="results-head"><h2>${list.length} restaurant${list.length === 1 ? '' : 's'}${state.loc ? ' near you' : ''}</h2>
    ${state.loc?.approx ? `<span class="muted" style="font-size:13px">Distances are approximate${state.loc.unknown ? ' (address not found)' : ''}</span>` : ''}</div>`;
  let dishes = '';
  if (q.length >= 2) {
    const hits = [];
    for (const r of list) for (const s of r.menu) for (const it of s.items) if (it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q)) {
      const best = cheapestItemPrice(r, it); hits.push({ r, it, best });
    }
    hits.sort((a, b) => (a.best?.price ?? a.it.prices.instore + 1000) - (b.best?.price ?? b.it.prices.instore + 1000));
    if (hits.length) dishes = `<h2 style="font-size:17px;margin:4px 0 10px">Dishes · cheapest first</h2><div class="dishes">${hits.slice(0, 12).map(({ r, it, best }) => {
      const km = distTo(r);
      return `<button class="dish" data-open="${esc(r.id)}" data-item="${esc(it.id)}">
        <span><b>${esc(it.name)}</b> <span class="muted">· ${esc(r.name)}${km != null ? ` · ${fmtKm(km)}` : ''}</span></span>
        <span class="right">${best ? `${badge(best.k)} <b>${money(best.price)}</b>` : '<span class="muted">No delivery</span>'} <span class="muted" style="font-size:12px">in-store ${money(it.prices.instore)}</span></span>
      </button>`; }).join('')}</div>`;
  }
  const banner = pickSponsor('banner', null);
  const bannerHtml = banner ? bannerView(banner) : '';
  if (state.layout === 'map') {
    el.innerHTML = head + bannerHtml + dishes + '<div id="map" role="region" aria-label="Map of restaurants"></div>';
    drawMap(list);
  } else {
    // A featured sponsor is pinned first, but only if it matches the current filters.
    const feat = pickSponsor('featured', list);
    const fr = feat && list.find(r => r.id === feat.restaurantId);
    const rest = fr ? list.filter(r => r !== fr) : list;
    el.innerHTML = head + bannerHtml + dishes + `<div class="grid">${fr ? cardView(fr, feat) : ''}${rest.map(r => cardView(r)).join('') || (fr ? '' : '<div class="empty">No restaurants match those filters.</div>')}</div>`;
    if (fr) seen(feat);
  }
  if (banner) seen(banner);
}

// The answer for a restaurant, as a short badge for the photo plus a full sentence for screen readers.
function saveBadge(r) {
  const b = bestWay(r), km = distTo(r);
  if (!b.best) return r.pickup
    ? { cls: 'pick', html: `${badge('pickup')} Pickup only`, sr: `No delivery to your address. Pickup${km != null ? `, ${walkMin(km)} minute walk` : ''}.` }
    : { cls: 'none', html: 'No delivery here', sr: 'No delivery to your address.' };
  const q = b.quotes[b.best], name = PLATFORMS[b.best].label;
  if (b.avail.length === 1) return { cls: '', html: `${badge(b.best)} Only on ${PLATFORMS[b.best].short}`, sr: `Only on ${name}, about ${money(q.total)} for a typical order.` };
  const save = b.quotes[b.worst].total - q.total;
  if (save >= 0.5) return { cls: '', html: `${badge(b.best)} Save $${Math.round(save)}`, sr: `Cheapest via ${name}: saves about ${money(save)} on a typical order compared with ${PLATFORMS[b.worst].label}.` };
  return { cls: '', html: `${badge(b.best)} Cheapest`, sr: `Cheapest via ${name}, about the same as the other apps.` };
}
// Stand-in until a restaurant has a photo: a pattern in its cuisine's colours, slightly different for each restaurant.
function cuisinePattern(r) {
  let h = 0; for (const c of r.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => { h = (h * 1103515245 + 12345) >>> 0; return h / 4294967296; };
  const dots = Array.from({ length: 7 }, (_, i) => {
    const hue = (r.hue + [-14, 8, 22, -4, 30, 14, -20][i] + 360) % 360, x = Math.round(6 + rnd() * 88), y = Math.round(8 + rnd() * 84), size = Math.round(5 + rnd() * 7);
    return `radial-gradient(circle at ${x}% ${y}%, hsl(${hue} 48% 62% / .55) 0 ${size}%, transparent ${size + 1}%)`;
  });
  return `${dots.join(', ')}, linear-gradient(135deg, hsl(${r.hue} 30% 34%), hsl(${(r.hue + 18) % 360} 34% 22%))`;
}
const icon = (id, cls = 'ico') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;

function cardView(r, sponsor) {
  const km = distTo(r), deals = userDeals(r), f = freshness(r.source, r.checkedAt), sb = saveBadge(r), cr = combinedRating(r);
  const photo = safeUrl(r.photo)
    ? `<div class="photo" style="background-image:url('${esc(r.photo)}')" role="img" aria-label="${esc(r.name)}"></div>`
    : `<div class="photo pattern" style="background:${cuisinePattern(r)}" aria-hidden="true"><span>${r.emoji}</span></div>`;
  const dealPlatforms = [...new Set(deals.map(d => PLATFORMS[d.platform].label))].join(', ');
  return `<div class="card ${sponsor ? 'sponsored' : ''}">
    <button class="open" data-open="${esc(r.id)}" ${sponsor ? `data-sponsor="${esc(sponsor.id)}"` : ''} aria-label="${esc(r.name)}${sponsor ? ' (sponsored)' : ''}. ${esc(sb.sr)}">
      <div class="photo-wrap">
        ${photo}
        <span class="save-badge ${sb.cls}" aria-hidden="true">${sb.html}</span>
        ${deals.length ? `<span class="deal-chip" title="${esc(deals.map(promoLabel).join(' · '))}">${icon('i-tag')} ${deals.length === 1 ? 'Deal' : deals.length + ' deals'}<span class="sr"> on ${esc(dealPlatforms)}</span></span>` : ''}
        ${sponsor ? '<span class="sp-chip">Sponsored</span>' : ''}
      </div>
      <div class="body">
        <div class="titlerow"><h3>${esc(r.name)}</h3>${cr.rating != null ? `<span class="rating" title="${esc(r.ratings.map(x => `${x.src} ${x.rating.toFixed(1)}${x.count != null ? ` (${x.count})` : ''}`).join(' · '))}"><span class="star">★</span> ${cr.rating.toFixed(1)}${cr.count < 50 ? ' <small class="muted">new</small>' : ''}</span>` : ''}</div>
        <div class="iconrow">
          <span>${esc(r.cuisine)} · ${dollars(r.tier)}</span>
          ${km != null ? `<span title="${esc(r.suburb)}">${icon('i-pin')}${fmtKm(km)}</span>${r.pickup ? `<span title="Walking time for pickup">${icon('i-walk')}${walkMin(km)} min</span>` : ''}` : `<span>${esc(r.suburb)}</span>`}
          <span class="fresh-dot ${f.cls}" title="${esc(f.long)}"><span class="sr">${esc(f.long)}</span></span>
        </div>

    </button>
    <button class="fav" data-fav="${esc(r.id)}" aria-pressed="${isFav(r)}" aria-label="${isFav(r) ? 'Remove from' : 'Add to'} favourites">${icon(isFav(r) ? 'i-heart-fill' : 'i-heart')}</button>
  </div>`;
}

/* ==================================================================
 * Sponsored placements. Always labelled "Sponsored", and they never change
 * prices, the "cheapest" badges or the order of the other results.
 * ================================================================== */
function userSuburb() {
  if (!state.loc) return null;
  let best = null, bd = Infinity;
  for (const [n, [lat, lng]] of Object.entries(SUBURBS)) { const d = distKm(state.loc, { lat, lng }); if (d < bd) { bd = d; best = n; } }
  return best;
}
const sessionSeed = Math.floor(Math.random() * 1000);
function pickSponsor(placement, list) {
  const now = new Date(), sub = state.filters.suburb !== 'All' ? state.filters.suburb : userSuburb(), cui = state.filters.cuisine;
  const ok = state.sponsors.filter(s => s.placement === placement && s.active &&
    (!s.starts || s.starts <= now) && (!s.ends || s.ends >= new Date(now.toDateString())) &&
    (!s.suburbs.length || (sub && s.suburbs.some(x => x.toLowerCase() === sub.toLowerCase()))) &&
    (!s.cuisines.length || cui === 'All' || s.cuisines.some(x => x.toLowerCase() === cui.toLowerCase())) &&
    (placement !== 'featured' || (list && list.some(r => r.id === s.restaurantId))));
  return ok.length ? ok[sessionSeed % ok.length] : null;   // rotate between sponsors per visit
}
function bannerView(s) {
  const r = state.restaurants.find(x => x.id === s.restaurantId);
  const img = safeUrl(s.image) ? `<div class="sp-img" style="background-image:url('${esc(s.image)}')" role="img" aria-label=""></div>` : r ? `<div class="sp-img" style="background:hsl(${r.hue} 60% 86% / .6)" aria-hidden="true">${r.emoji}</div>` : '';
  return `<button class="sp-banner" data-sponsor-banner="${esc(s.id)}">
    ${img}
    <span class="sp-text"><span class="sp-label">Sponsored${s.advertiser ? ' · ' + esc(s.advertiser) : ''}</span>
      <b>${esc(s.headline || s.advertiser)}</b>${s.body ? `<span class="muted">${esc(s.body)}</span>` : ''}</span>
    <span class="sp-cta">${esc(s.cta || 'Take a look')} →</span>
  </button>`;
}
const seenThisVisit = new Set();
function seen(s) { if (!seenThisVisit.has(s.id)) { seenThisVisit.add(s.id); track('Sponsor impression', { sponsor: s.id, placement: s.placement }); } }

/* ==================================================================
 * Traffic analytics (Plausible and/or Google Analytics 4). Does nothing until configured.
 * ================================================================== */
function loadAnalytics() {
  if (loadAnalytics.done) return; loadAnalytics.done = true;
  if (ANALYTICS.plausibleDomain) {
    window.plausible = window.plausible || function () { (window.plausible.q = window.plausible.q || []).push(arguments); };
    const s = document.createElement('script'); s.defer = true; s.dataset.domain = ANALYTICS.plausibleDomain;
    s.src = 'https://plausible.io/js/script.manual.js'; document.head.appendChild(s);
  }
  if (ANALYTICS.ga4MeasurementId) {
    const s = document.createElement('script'); s.async = true; s.src = 'https://www.googletagmanager.com/gtag/js?id=' + encodeURIComponent(ANALYTICS.ga4MeasurementId); document.head.appendChild(s);
    window.dataLayer = window.dataLayer || []; window.gtag = function () { dataLayer.push(arguments); };
    gtag('js', new Date()); gtag('config', ANALYTICS.ga4MeasurementId, { send_page_view: false });
  }
}
function track(name, props = {}) {
  try {
    if (window.plausible) window.plausible(name, { props });
    if (window.gtag) window.gtag('event', name.toLowerCase().replace(/\s+/g, '_'), props);
  } catch {}
}
let lastPage = '';
function trackPage() {
  const page = state.view === 'restaurant' ? '/restaurant/' + state.restaurantId : '/' + state.view;
  if (page === lastPage) return; lastPage = page;
  try {
    if (window.plausible) window.plausible('pageview', { u: location.origin + page });
    if (window.gtag) window.gtag('event', 'page_view', { page_path: page, page_title: state.view });
  } catch {}
}

/* ---------- Map (Leaflet + OpenStreetMap, loaded only when needed) ---------- */
let leafletReady = null, mapObj = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((res, rej) => {
    const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css'; document.head.appendChild(css);
    const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s);
  });
  return leafletReady;
}
async function drawMap(list) {
  try { await loadLeaflet(); } catch { const m = $('#map'); if (m) m.innerHTML = '<p class="empty">The map needs an internet connection.</p>'; leafletReady = null; return; }
  const el = $('#map'); if (!el) return;
  if (mapObj) { mapObj.remove(); mapObj = null; }
  const pts = list.filter(r => r.lat != null);
  const center = state.loc ? [state.loc.lat, state.loc.lng] : SUBURBS.Enmore;
  mapObj = L.map(el, { scrollWheelZoom: false }).setView(center, 14);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(mapObj);
  const brand = getComputedStyle(document.documentElement).getPropertyValue('--brand').trim() || '#4b9cd3';
  if (state.loc) L.circleMarker(center, { radius: 8, color: '#fff', weight: 3, fillColor: '#142033', fillOpacity: 1 }).addTo(mapObj).bindTooltip('You');
  for (const r of pts) {
    const b = bestWay(r), q = b.best && b.quotes[b.best];
    L.circleMarker([r.lat, r.lng], { radius: 9, color: '#fff', weight: 2, fillColor: brand, fillOpacity: 1 }).addTo(mapObj)
      .bindPopup(`<div class="map-pop"><b>${esc(r.name)}</b><br>${esc(r.cuisine)} · ${dollars(r.tier)}<br>${q ? `Cheapest: ${PLATFORMS[b.best].label} ~${money(q.total)}` : 'No delivery here'}<br><button class="link-btn" data-open="${esc(r.id)}">View menu →</button></div>`);
  }
  if (pts.length) mapObj.fitBounds(L.latLngBounds([...pts.map(r => [r.lat, r.lng]), ...(state.loc ? [center] : [])]).pad(0.15));
}

          ${feeRow('Your membership', (p, k) => MEMBERSHIPS[k] && profile.members[k] ? `${MEMBERSHIPS[k].name}: ${money(MEMBERSHIPS[k].delivery)} delivery over ${money(MEMBERSHIPS[k].minOrder)}` : '—')}
          ${feeRow('Est. delivery time', () => { const [a, z] = deliveryEta(km); return `${a}–${z} min`; })}

    </div>

}

function worstAddon(it, on) {
  let w = null;
  for (const g of it.groups) for (const o of g.options) for (const k of on) {
    if (k === 'direct' || !(o.prices.instore > 0) || o.prices[k] == null) continue;
    const m = o.prices[k] / o.prices.instore - 1;
    if (m > 0.004 && (!w || m > w.m)) w = { k, m };
  }
  return w;
}
function addonInsight(r, on) {
  const rows = on.filter(k => k !== 'direct').map(k => [k, modifierMarkup(r, k)]).filter(([, m]) => m.count && m.addons != null);
  if (!rows.length) return '';
  return `<div class="addon-insight"><b>Add-ons:</b> ${rows.map(([k, m]) => `${badge(k)} options cost <span class="pct">${pct(m.addons)}</span> vs in-store${m.items != null && m.addons - m.items > 0.02 ? ` <span class="muted">(items ${pct(m.items)})</span>` : ''}`).join(' · ')}</div>`;
}
function itemView(r, it, on, q, rf) {
  const best = cheapestItemPrice(r, it);
  const itf = freshness(r.source, it.checkedAt);
  const ownDate = it.checkedAt && r.checkedAt && it.checkedAt.toDateString() !== r.checkedAt.toDateString();
  const chip = k => {
    const p = it.prices[k];
    if (p === null) return `<span class="price na">${badge(k)} n/a</span>`;
    const infl = p / it.prices.instore - 1;
    return `<span class="price ${best && best.k === k ? 'best' : ''}">${badge(k)} <b>${money(p)}</b>${infl > 0.004 ? `<span class="pct">${pct(infl)}</span>` : ''}<span class="sr"> on ${PLATFORMS[k].label}</span></span>`;
  };
  return `<div class="item ${itf.cls === 'stale' ? 'stale' : ''} ${safeUrl(it.photo) ? '' : 'no-thumb'}" id="item-${esc(it.id)}">
    ${safeUrl(it.photo) ? `<div class="thumb" style="background-image:url('${esc(it.photo)}')" role="img" aria-label="${esc(it.name)}"></div>` : ''}
    <div>
      <div class="name">${esc(it.name)} ${it.tags.map(t => `<span class="diet" title="${esc(t)}">${DIETS[t]}</span>`).join('')}</div>
      <div class="desc">${esc(it.desc)}</div>
      <div class="prices">
        <span class="price instore">In-store <b>${money(it.prices.instore)}</b></span>
        ${on.map(chip).join('')}
      </div>
      ${it.groups.length ? `<div class="mod-sum">${esc(it.groups.map(g => g.name).join(' · '))}${(() => { const w = worstAddon(it, on); return w ? ` · <span class="pct">add-ons up to ${pct(w.m)} on ${PLATFORMS[w.k].label}</span>` : ''; })()}</div>` : ''}
      <button class="link-btn report-link" data-report="${esc(it.id)}">Wrong price?</button>
      ${ownDate || (itf.cls === 'stale' && rf.cls !== 'stale') ? `<div style="margin-top:6px">${freshTag(itf)}</div>` : ''}
    </div>
    <div class="actions">${it.groups.length
      ? `<button class="btn secondary customise" data-customise="${esc(it.id)}">${q ? `${q} in cart · ` : ''}Choose options</button>`
      : q
      ? `<div class="qty"><button data-dec="${esc(it.id)}" aria-label="Remove one ${esc(it.name)}">−</button><b>${q}</b><button data-inc="${esc(it.id)}" aria-label="Add one ${esc(it.name)}">+</button></div>`
      : `<button class="add" data-inc="${esc(it.id)}" aria-label="Add ${esc(it.name)} to cart">+</button>`}</div>
  </div>`;
}

/* ---------- Cart ---------- */
function cartFreshness(r) {
  const dates = state.cart.lines.map(l => findItem(r, l.itemId).checkedAt).filter(Boolean);
  const f = freshness(r.source, dates.length ? new Date(Math.min(...dates)) : null);
  const menu = f.cls === 'live' ? 'Menu prices live' : f.cls === 'unknown' ? 'Menu prices: date unknown' : `Menu prices ${f.short.replace(/^Checked/, 'checked').replace(/^Synced/, 'synced')}`;
  return `<span class="fresh ${f.cls}">${menu}</span> · fees estimated`;
}

function renderCart() {
  const cart = state.cart;
  const count = cart.lines.reduce((a, l) => a + l.qty, 0);
  $('#cartCount').textContent = count;
  const body = $('#cartBody'), btn = $('#checkout'), sav = $('#savings');

  }
  $('#cartTitle').textContent = r.name;
  const b = bestWay(r, cart.lines), quotes = b.quotes, pk = b.pickup;
  if (!state.choice || (state.choice === 'pickup' ? !pk.available : !quotes[state.choice]?.available)) state.choice = b.best || (pk.available ? 'pickup' : null);
  const instore = cart.lines.reduce((a, l) => a + unitPrice(r, l, 'instore').price * l.qty, 0);

  const optView = k => {
    const q = quotes[k];
    if (!q.available) return `<button class="opt" disabled aria-checked="false"><span class="radio"></span>
      <div><div class="pname">${badge(k)} ${PLATFORMS[k].label}</div><div class="sub">${esc(q.reason)}</div></div><div></div></button>`;
    return `<button class="opt" role="radio" data-choose="${k}" aria-checked="${state.choice === k}"><span class="radio"></span>
      <div><div class="pname">${badge(k)} ${PLATFORMS[k].label} ${k === b.best && b.avail.length > 1 ? '<span class="badge">Cheapest delivery</span>' : ''}</div>
        <div class="sub"><span class="infl">${pct(q.totalInflation)}</span> vs in-store · menu ${pct(q.menuInflation)} · ${q.eta}</div>
        ${q.memberApplied ? `<div class="note">✓ ${q.memberName} applied</div>` : q.memberShortBy ? `<div class="hint">Add ${money(q.memberShortBy)} for ${q.memberName} benefits</div>` : ''}
        ${q.promo ? `<div class="note">🏷 ${esc(promoLabel(q.promo))}</div>` : ''}
        ${q.hints.slice(0, 2).map(h => `<div class="hint">${esc(h)}</div>`).join('')}</div>
      <div class="total">${money(q.total)}</div>
      <div class="breakdown">
        <span>Items</span><span>${money(q.subtotal)}</span>
        <span>Delivery${q.memberApplied ? ` (${q.memberName})` : ' (est.)'}</span><span>${q.delivery ? money(q.delivery) : 'Free'}</span>
        ${q.service ? `<span>Service fee${q.memberApplied ? ` (${q.memberName})` : ' (est.)'}</span><span>${money(q.service)}</span>` : ''}
        ${q.small ? `<span>Small-order fee (est.)</span><span>${money(q.small)}</span>` : ''}
        ${q.discount ? `<span class="disc">Deal</span><span class="disc">−${money(q.discount)}</span>` : ''}
      </div></button>`;
  };
  const cheapestDelivery = b.best ? quotes[b.best].total : null;
  body.innerHTML = `
    ${cart.lines.map(l => { const it = findItem(r, l.itemId), on = optionNames(r, l); return `<div class="line">
      <div class="qty"><button data-dec="${esc(l.key)}" aria-label="Remove one ${esc(it.name)}">−</button><b>${l.qty}</b><button data-inc="${esc(l.key)}" aria-label="Add one ${esc(it.name)}">+</button></div>
      <span style="flex:1">${esc(it.name)}${on.length ? `<br><small class="muted">${esc(on.join(', '))}</small>` : ''}</span><span>${money(unitPrice(r, l, 'instore').price * l.qty)} <small class="muted">in-store</small></span></div>`; }).join('')}
    <h3 class="compare-title">Compare this order</h3>
    <div class="cart-fresh">${cartFreshness(r)}</div>
    <div class="instore-ref"><span>In-store price</span><b>${money(r2(instore))}</b></div>
    <div role="radiogroup" aria-label="How to order">
      ${[...b.avail, ...PKEYS.filter(k => !quotes[k].available && r.platforms[k])].map(optView).join('')}
      ${pk.available ? `<div class="or">or skip the fees</div>
      <button class="opt" role="radio" data-choose="pickup" aria-checked="${state.choice === 'pickup'}"><span class="radio"></span>
        <div><div class="pname">${badge('pickup')} Pick it up yourself</div>
          <div class="sub">In-store price${pk.walk ? ` · 🚶 ${pk.walk} min walk (${fmtKm(pk.km)})` : ''}</div>
          ${cheapestDelivery != null && cheapestDelivery - pk.total >= 0.5 ? `<div class="note">${money(cheapestDelivery - pk.total)} less than the cheapest delivery</div>` : ''}</div>
        <div class="total">${money(pk.total)}</div></button>` : ''}

  if (state.choice) {
    const total = state.choice === 'pickup' ? pk.total : quotes[state.choice].total;
    const base = baselineFor(b, state.choice);
    btn.disabled = false;
    btn.textContent = state.choice === 'pickup' ? `Get directions · pay ${money(total)} in-store` : `Order via ${PLATFORMS[state.choice].label} · ${money(total)}`;
    const diff = base.total - total;
    sav.textContent = base.kind === 'none' || diff <= 0.005 ? ''
      : `You save ${money(diff)} vs ${base.kind === 'usual' ? `your usual ${PLATFORMS[base.platform].label}` : 'the most expensive app'}`;

  }
}
