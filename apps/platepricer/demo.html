async function setLocation(loc, save = true) {
  state.loc = loc; store.set('loc', loc);
  if (save && loc.label && !profile.addresses.some(a => a.label === loc.label)) { profile.addresses.unshift(loc); profile.addresses = profile.addresses.slice(0, 5); saveProfile(); }
  state.view = profile.onboarded ? 'browse' : 'onboard';
  render();
}
function changeQty(key, delta, opts) {
  const itemId = key.split('|')[0];
  const rid = itemId.split('::')[0];
  if (state.cart.restaurantId && state.cart.restaurantId !== rid && delta > 0) {
    const other = state.restaurants.find(r => r.id === state.cart.restaurantId);
    if (!confirm(`Your cart has items from ${other.name}. Start a new cart?`)) return;
    state.cart = { restaurantId: null, lines: [] };
  }
  state.cart.restaurantId = rid;
  let line = state.cart.lines.find(l => l.key === key);
  if (!line) { line = { key, itemId, opts: opts || [], qty: 0 }; state.cart.lines.push(line); }
  line.qty += delta;
  state.cart.lines = state.cart.lines.filter(l => l.qty > 0);
  if (!state.cart.lines.length) state.cart.restaurantId = null;
  store.set('cart', state.cart);
  rerenderInPlace();
}
function rerenderInPlace() {
  const y = scrollY;
  if (state.view === 'restaurant') $('#app').innerHTML = restaurantView(state.restaurants.find(r => r.id === state.restaurantId));
  else if (state.view === 'browse') renderResults();
  else if (state.view === 'profile') $('#app').innerHTML = profileView();
  document.querySelectorAll('[data-member]').forEach(b => b.setAttribute('aria-pressed', String(!!profile.members[b.dataset.member])));
  renderCart(); scrollTo(0, y);
}
let lastFocus = null;
function openCart(open) {
  $('#cart').classList.toggle('open', open); $('#scrim').classList.toggle('open', open);
  if (open) { lastFocus = document.activeElement; setTimeout(() => $('#cartClose').focus(), 50); } else if (lastFocus) lastFocus.focus();
}
async function loadCsvFiles(files) {
  const got = {};
  for (const f of files) {
    const text = await f.text();
    const cols = Object.keys(parseCSV(text.split(/\r?\n/).slice(0, 2).join('\n'))[0] || {});
    if (cols.includes('placement') && cols.includes('sponsor_id')) got.sponsors = text;
    else if (cols.includes('option') && cols.includes('group')) got.modifiers = text;
    else if (cols.includes('type') && cols.includes('platform')) got.promotions = text;
    else if (cols.includes('item') || cols.includes('instore_price')) got.menu = text;
    else if (cols.includes('name') || cols.includes('suburb')) got.restaurants = text;
  }
  const prev = store.get('uploadedCsv', {}) || {};
  const merged = { restaurants: got.restaurants || prev.restaurants, menu: got.menu || prev.menu, promotions: got.promotions || prev.promotions || '', sponsors: got.sponsors || prev.sponsors || '', modifiers: got.modifiers || prev.modifiers || '' };
  store.set('uploadedCsv', merged);
  if (!merged.restaurants || !merged.menu) return toast(`Now load ${merged.restaurants ? 'menu' : 'restaurants'}.csv too.`);
  const list = restaurantsFromCSV(parseCSV(merged.restaurants), parseCSV(merged.menu), parseCSV(merged.modifiers));
  if (!list.length) return toast('No restaurants with menu items found. Check the column names against the template.');
  state.restaurants = list; state.promotions = promotionsFromCSV(parseCSV(merged.promotions)); state.sponsors = sponsorsFromCSV(parseCSV(merged.sponsors)); state.dataSource = 'uploaded';
  state.cart = { restaurantId: null, lines: [] }; store.set('cart', state.cart);
  state.filters = { ...state.filters, cuisine: 'All', suburb: 'All' };
  toast(`Loaded ${list.length} restaurant${list.length === 1 ? '' : 's'}${state.promotions.length ? ` and ${state.promotions.length} deals` : ''}.`); render();
}
function openRestaurant(id, itemId) {
  state.view = 'restaurant'; state.restaurantId = id; state.focusItem = itemId || null;
  const r = state.restaurants.find(x => x.id === id);
  if (r) track('View restaurant', { restaurant: r.name, suburb: r.suburb });
  render();
}

document.addEventListener('submit', async e => {
  e.preventDefault();
  if (e.target.id === 'addrForm') {
    const v = $('#addrInput').value.trim(); if (!v) return;
    if (addr.list.length && addr.active >= 0) return pickSuggestion(addr.active);
    const btn = e.target.querySelector('button'); btn.disabled = true; btn.textContent = 'Finding…';
    await setLocation(await geocode(v));
  } else if (e.target.id === 'paidForm') {
    const v = num(new FormData(e.target).get('paid'));
    if (v === null || v <= 0) return toast('Enter the total you paid.');
    answerOrder(e.target.dataset.oid, 'yes', v);
  } else if (e.target.id === 'customiseForm') {
    const sel = customiseSelection(), r = state.restaurants.find(x => x.id === sel.itemId.split('::')[0]), it = findItem(r, sel.itemId);
    const missingGroup = it.groups.find((g, gi) => g.required && !e.target.querySelector(`input[name="g${gi}"]:checked`));
    if (missingGroup) return toast(`Choose a ${missingGroup.name.toLowerCase()} first.`);
    $('#dlg').close();
    changeQty(lineKey(sel.itemId, sel.opts), sel.qty, sel.opts);
    track('Add to cart', { options: sel.opts.length });
    toast(`Added ${sel.qty} × ${it.name} to your cart.`);
  } else if (e.target.id === 'mismatchForm') {
    const o = profile.orders.find(x => x.id === e.target.dataset.oid);
    if (o) submitMismatch(new FormData(e.target), o);
  } else if (e.target.id === 'reportForm') {
    submitReport(new FormData(e.target), e.target.dataset.rid);
  } else if (e.target.id === 'onboardForm') {
    const f = new FormData(e.target);
    profile.members = { doordash: f.has('m_doordash'), ubereats: f.has('m_ubereats') };
    profile.newTo = { doordash: f.has('n_doordash'), ubereats: f.has('n_ubereats') };
    profile.usualApp = f.get('usual') || '';
    profile.onboarded = true; saveProfile(); state.view = 'browse'; render();
  }
});
let searchT, trackT;
document.addEventListener('input', e => {
  if (e.target.id === 'search') { clearTimeout(searchT); searchT = setTimeout(() => { state.filters.q = e.target.value; renderResults(); }, 120);
    clearTimeout(trackT); trackT = setTimeout(() => { const q = state.filters.q.trim().toLowerCase(); if (q.length > 2) track('Search', { query: q.slice(0, 40) }); }, 1500); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'csvInput') { if (t.files.length) loadCsvFiles([...t.files]); return; }
  if (t.dataset.filter) { state.filters[t.dataset.filter] = t.value; renderResults(); return; }
  if (t.id === 'dietOnly') { state.dietOnly = t.checked; rerenderInPlace(); return; }
  if (t.dataset.pmember) { profile.members[t.dataset.pmember] = t.checked; state.choice = null; saveProfile(); rerenderInPlace(); return; }
  if (t.dataset.pnew) { profile.newTo[t.dataset.pnew] = t.checked; state.choice = null; saveProfile(); rerenderInPlace(); return; }
  if (t.dataset.diet) { profile.diet = t.checked ? [...new Set([...profile.diet, t.dataset.diet])] : profile.diet.filter(d => d !== t.dataset.diet); saveProfile(); return; }
  if (t.name === 'usualApp') { profile.usualApp = t.value; saveProfile(); return; }
  if (t.name === 'theme') { profile.theme = t.value; saveProfile(); applyTheme(); return; }
  if (t.id === 'contrast') { profile.contrast = t.checked; saveProfile(); applyTheme(); }
});
document.addEventListener('click', async e => {
  const t = e.target.closest('button'); if (!t) return;
  const d = t.dataset;
  if (t.id === 'home') { state.view = state.loc ? 'browse' : 'landing'; render(); }
  else if (t.id === 'addrPill') { state.view = 'landing'; render(); }
  else if (t.id === 'profileBtn') { state.view = 'profile'; render(); }
  else if (t.id === 'cartBtn') openCart(true);
  else if (t.id === 'cartClose') openCart(false);
  else if (t.id === 'useLocation') {
    if (!navigator.geolocation) return toast('Location isn’t available in this browser.');
    t.textContent = 'Locating…';
    navigator.geolocation.getCurrentPosition(
      p => setLocation({ label: 'Current location', lat: p.coords.latitude, lng: p.coords.longitude, approx: false }, false),
      () => { t.textContent = '📍 Use my location'; toast('Couldn’t get your location. Enter an address instead.'); }, { timeout: 8000 });
  }
  else if (d.savedAddr !== undefined) { const a = profile.addresses[+d.savedAddr]; if (a) setLocation(a, false); }
  else if (d.delAddr !== undefined) { profile.addresses.splice(+d.delAddr, 1); saveProfile(); rerenderInPlace(); }
  else if (t.id === 'clearCsv') { store.set('uploadedCsv', undefined); await init(); toast('Removed uploaded data.'); }
  else if (t.id === 'resetProfile') { if (confirm('Clear your profile, savings and favourites from this device?')) { Object.assign(profile, structuredClone(DEFAULT_PROFILE)); saveProfile(); applyTheme(); render(); } }
  else if (d.member) {
    const k = d.member; profile.members[k] = !profile.members[k]; saveProfile(); state.choice = null; rerenderInPlace();
    toast(`${MEMBERSHIPS[k].name} ${profile.members[k] ? `on: $0 delivery and lower service fees over ${money(MEMBERSHIPS[k].minOrder)}` : 'off'}.`);
  }
  else if (d.fav) {
    profile.favs = profile.favs.includes(d.fav) ? profile.favs.filter(x => x !== d.fav) : [...profile.favs, d.fav]; saveProfile(); rerenderInPlace();
  }
  else if (d.layout) { state.layout = d.layout; document.querySelectorAll('[data-layout]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.layout === state.layout))); renderResults(); }
  else if (d.toggleFilter) { state.filters[d.toggleFilter] = !state.filters[d.toggleFilter]; t.setAttribute('aria-pressed', String(state.filters[d.toggleFilter])); renderResults(); }
  else if (d.cuisine) { state.filters.cuisine = d.cuisine; document.querySelectorAll('[data-cuisine]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.cuisine === d.cuisine))); renderResults(); }
  else if (d.open) { if (d.sponsor) track('Sponsor click', { sponsor: d.sponsor, placement: 'featured' }); openRestaurant(d.open, d.item); }
  else if (d.nav) { state.view = d.nav; render(); }
  else if (d.sponsorBanner) {
    const s = state.sponsors.find(x => x.id === d.sponsorBanner); if (!s) return;
    track('Sponsor click', { sponsor: s.id, placement: 'banner' });
    if (safeUrl(s.link)) window.open(s.link, '_blank', 'noopener'); else if (s.restaurantId) openRestaurant(s.restaurantId);
  }
  else if (d.inc) { changeQty(d.inc, 1); track('Add to cart', {}); }
  else if (d.dec) changeQty(d.dec, -1);
  else if (d.choose) { state.choice = d.choose; renderCart(); }
  else if (t.id === 'checkout' && state.choice) {
    const r = state.restaurants.find(x => x.id === state.cart.restaurantId);
    const b = bestWay(r, state.cart.lines);
    const total = state.choice === 'pickup' ? b.pickup.total : b.quotes[state.choice].total;
    const order = { id: String(Date.now()), date: Date.now(), restaurantId: r.id, restaurant: r.name, platform: state.choice,
                    estTotal: total, baseline: baselineFor(b, state.choice), status: 'pending', paid: null, items: state.cart.lines.reduce((a, l) => a + l.qty, 0),
                    lines: state.cart.lines.map(l => ({ itemId: l.itemId, name: findItem(r, l.itemId).name, opts: optionNames(r, l), qty: l.qty,
                      price: unitPrice(r, l, state.choice === 'pickup' ? 'instore' : state.choice).price ?? null })),
                    est: state.choice === 'pickup' ? { subtotal: total } : (({ subtotal, delivery, service, small, discount }) => ({ subtotal, delivery, service, small, discount }))(b.quotes[state.choice]) };
    profile.orders.push(order); saveProfile();
    track('Order click', { platform: state.choice, restaurant: r.name });
    const url = state.choice === 'pickup'
      ? (r.lat != null ? `https://www.google.com/maps/dir/?api=1&destination=${r.lat},${r.lng}` : '')
      : safeUrl(r.platforms[state.choice]?.url);
    if (url) { awaitingReturn = true; window.open(url, '_blank', 'noopener'); toast(`When you're back, tell us if you ordered so we can track your savings.`); }
    else { toast(`No ${state.choice === 'pickup' ? 'map location' : PLATFORMS[state.choice].label + ' link'} for ${r.name} yet (add one in restaurants.csv).`); setTimeout(askAboutOrder, 1500); }
  }
  else if (d.oc) answerOrder(d.oid, d.oc);
  else if (d.customise) openCustomise(d.customise);
  else if (d.mq) { const q = $('#modQty'); q.textContent = Math.max(1, (+q.textContent || 1) + +d.mq); }
  else if (d.report) openReport(d.report.split('::')[0], d.report);
  else if (d.reportR) openReport(d.reportR, '');
  else if (d.closeDlg !== undefined) $('#dlg').close();
  else if (d.skipMismatch !== undefined) { $('#dlg').close(); toast('Saved. Thanks for confirming your order.'); if (state.view === 'profile') rerenderInPlace(); }
  else if (d.confirmOrder) { const o = profile.orders.find(x => x.id === d.confirmOrder); if (o) { o.lastAsked = 0; showConfirm(o); } }
});
/* ==================================================================
 * Order confirmation: did they actually order after leaving for the app?
 * Savings only count as "confirmed" when the user says yes.
 * ================================================================== */
let awaitingReturn = false;
function baselineFor(b, chosen) {
  const usual = profile.usualApp;
  if (usual && b.quotes[usual]?.available) return { platform: usual, total: b.quotes[usual].total, kind: 'usual' };
  if (b.worst) return { platform: b.worst, total: b.quotes[b.worst].total, kind: 'highest' };
  return { platform: chosen, total: chosen === 'pickup' ? b.pickup.total : b.quotes[chosen].total, kind: 'none' };
}
const orderSaving = o => r2(o.baseline.total - (o.status === 'confirmed' ? o.paid : o.estTotal));
function expireOrders() {
  let changed = false;
  for (const o of profile.orders) if (o.status === 'pending' && Date.now() - o.date > CONFIRM_WINDOW_HOURS * 36e5) { o.status = 'unconfirmed'; changed = true; }
  if (changed) saveProfile();
}
function askAboutOrder() {
  expireOrders();
  if ($('#dlg').open) return;
  const o = [...profile.orders].reverse().find(x => x.status === 'pending' && Date.now() - (x.lastAsked || 0) > 2 * 6e4);
  if (o) showConfirm(o);
}
function showConfirm(o) {
  o.lastAsked = Date.now(); saveProfile();
  const how = o.platform === 'pickup' ? 'pick up your order from' : o.platform === 'direct' ? 'order directly from' : 'place your order with';
  const via = o.platform === 'pickup' || o.platform === 'direct' ? '' : ` on ${PLATFORMS[o.platform].label}`;
  const dlg = $('#dlg');
  dlg.innerHTML = `<h2>Did you ${how} ${esc(o.restaurant)}${via}?</h2>
    <p class="muted" style="margin:0;font-size:14px">This keeps your savings honest. Only confirmed orders count.</p>
    <div class="dlg-actions">
      <button class="btn" data-oc="yes" data-oid="${o.id}">Yes, it was ${money(o.estTotal)}</button>
      <button class="btn secondary" data-oc="diff" data-oid="${o.id}">Yes, but the total was different</button>
      <form id="paidForm" data-oid="${o.id}" hidden>
        <label class="field">Total you paid (before tip)<input name="paid" inputmode="decimal" placeholder="e.g. 61.40"></label>
        <button class="btn" type="submit" style="width:100%;margin-top:8px">Save</button>
      </form>
      <button class="btn secondary" data-oc="no" data-oid="${o.id}">No, I didn't order</button>
      <button class="link-btn" data-oc="later" data-oid="${o.id}" style="align-self:center;margin-top:4px">Ask me later</button>
    </div>`;
  if (!dlg.open) dlg.showModal();
}
function answerOrder(id, answer, paid) {
  const o = profile.orders.find(x => x.id === id); if (!o) return;
  const dlg = $('#dlg');
  if (answer === 'diff') { dlg.querySelector('#paidForm').hidden = false; dlg.querySelector('#paidForm input').focus(); return; }
  if (answer === 'later') { dlg.close(); return; }
  if (answer === 'no') { o.status = 'declined'; saveProfile(); dlg.close(); toast('Thanks. That order won’t count toward your savings.'); }
  if (answer === 'yes') {
    o.status = 'confirmed'; o.paid = r2(paid ?? o.estTotal); saveProfile();
    track('Order confirmed', { platform: o.platform, restaurant: o.restaurant, saved: Math.round(orderSaving(o)) });
    const diff = o.paid - o.estTotal;
    if (Math.abs(diff) >= Math.max(1, o.estTotal * 0.03)) {
      track('Order total differed', { platform: o.platform, restaurant: o.restaurant, difference: Math.round(diff) });
      return showMismatch(o, diff);
    }
    dlg.close();
    const s = orderSaving(o);
    const vs = o.baseline.kind === 'usual' ? `your usual ${PLATFORMS[o.baseline.platform].label}` : o.baseline.platform && o.baseline.platform !== 'pickup' ? PLATFORMS[o.baseline.platform].label : 'the alternatives';
    toast(s > 0.005 ? `Confirmed: you saved ${money(s)} vs ${vs}.` : 'Confirmed. Thanks!');
  }
  if (state.view === 'profile') rerenderInPlace();
}
// When the real total differs from the estimate, ask what was different (optional, one tap),
// and send it to the owner like a price report so the sheet can be fixed.
const MISMATCH_REASONS = [['items', 'Item prices'], ['delivery', 'Delivery fee'], ['fees', 'Service or other fees'], ['deal', 'A deal or discount'], ['tip', 'The tip was included'], ['unsure', 'Not sure']];
const whereLabel = k => k === 'pickup' ? 'In-store (pickup)' : PLATFORMS[k]?.label || k;
function showMismatch(o, diff) {
  const e = o.est || {};
  const parts = [['Items', e.subtotal], ['Delivery', e.delivery], ['Service fee', e.service], ['Small-order fee', e.small], ['Deal', e.discount ? -e.discount : null]].filter(([, v]) => v);
  $('#dlg').innerHTML = `<form id="mismatchForm" data-oid="${o.id}">
    <h2>Thanks! Your total was ${money(Math.abs(diff))} ${diff > 0 ? 'more' : 'less'} than our estimate</h2>
    <p class="muted" style="margin:0;font-size:14px">We estimated ${money(o.estTotal)} on ${esc(whereLabel(o.platform))}${parts.length ? ` (${parts.map(([k, v]) => `${k} ${v < 0 ? '−' : ''}${money(Math.abs(v))}`).join(' · ')})` : ''}. What was different? This helps us fix the prices. It’s optional.</p>
    <div class="radios" style="margin-top:12px">${MISMATCH_REASONS.map(([v, l]) => `<label><input type="checkbox" name="reason" value="${v}"> ${l}</label>`).join('')}</div>
    ${(o.lines || []).length ? `<div id="mmItems" hidden>
      <p class="muted" style="margin:14px 0 4px;font-size:13px">Which items? Type the price you saw for any that were different (each, before fees).</p>
      ${o.lines.map((l, i) => `<label class="mm-line"><span><b>${l.qty} × ${esc(l.name)}</b>${l.opts.length ? `<br><small class="muted">${esc(l.opts.join(', '))}</small>` : ''}<br><small class="muted">We showed ${l.price != null ? money(l.price) : 'n/a'} each</small></span>
        <input name="seen${i}" inputmode="decimal" placeholder="Price you saw" aria-label="Price you saw for ${esc(l.name)}"></label>`).join('')}
    </div>` : ''}
    <div class="dlg-actions"><button class="btn" type="submit">Send</button><button class="btn secondary" type="button" data-skip-mismatch>Skip</button></div>
  </form>`;
}
document.addEventListener('change', e => {
  if (e.target.name === 'reason' && e.target.value === 'items' && $('#mmItems')) $('#mmItems').hidden = !e.target.checked;
});
function submitMismatch(f, o) {
  const reasons = f.getAll('reason');
  const r = state.restaurants.find(x => x.id === o.restaurantId);
  const reasonText = reasons.map(v => MISMATCH_REASONS.find(([k]) => k === v)?.[1]).filter(Boolean).join(', ') || 'not given';
  const e = o.est || {};
  const breakdown = `Estimate: items ${money(e.subtotal ?? 0)}${e.delivery ? `, delivery ${money(e.delivery)}` : ''}${e.service ? `, service ${money(e.service)}` : ''}${e.small ? `, small-order ${money(e.small)}` : ''}${e.discount ? `, deal -${money(e.discount)}` : ''}`;
  const base = { date: Date.now(), restaurantId: o.restaurantId, restaurant: o.restaurant, platform: o.platform === 'pickup' ? '' : o.platform, where: whereLabel(o.platform) };
  const reports = [{ ...base, item: 'Order total', shown: o.estTotal, seen: o.paid, note: `Different: ${reasonText}. ${breakdown}`, kind: 'order' }];
  if (reasons.includes('items')) (o.lines || []).forEach((l, i) => {
    const seen = num(f.get('seen' + i));
    if (seen != null) reports.push({ ...base, item: l.name + (l.opts.length ? ` (${l.opts.join(', ')})` : ''), shown: l.price, seen, note: `After an order of ${money(o.paid)}`, kind: 'order' });
  });
  $('#dlg').close();
  deliverReports(reports, r);
  track('Order difference explained', { platform: o.platform, restaurant: o.restaurant, reasons: reasonText });
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && awaitingReturn) { awaitingReturn = false; setTimeout(askAboutOrder, 600); }
});

function savingsSection() {
  expireOrders();
  const by = st => profile.orders.filter(o => o.status === st);
  const confirmed = by('confirmed'), est = [...by('pending'), ...by('unconfirmed')];
  const sum = list => list.reduce((a, o) => a + orderSaving(o), 0);
  const label = { confirmed: 'Confirmed', pending: 'Waiting for you', unconfirmed: 'Estimate', declined: "Didn't order" };
  const vs = o => o.baseline.kind === 'usual' ? `vs usual ${PLATFORMS[o.baseline.platform].short}` : o.baseline.kind === 'highest' ? 'vs priciest app' : '';
  return `<section><h3>Savings</h3>
    <div class="big-number">${money(sum(confirmed))}</div>
    <div class="muted" style="font-size:13px">confirmed across ${confirmed.length} order${confirmed.length === 1 ? '' : 's'}${profile.usualApp ? `, compared with ${PLATFORMS[profile.usualApp].label}, your usual app` : ', compared with the priciest app for the same order'}</div>
    ${est.length ? `<div style="font-size:13px;margin-top:6px">+ ${money(sum(est))} estimated from ${est.length} order${est.length === 1 ? '' : 's'} you haven't confirmed</div>` : ''}
    ${profile.orders.slice(-8).reverse().map(o => {
      const s = orderSaving(o);
      return `<div class="row"><span class="grow">${esc(o.restaurant)} · ${badge(o.platform)} <span class="muted">${new Date(o.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}</span></span>
        ${o.status === 'pending' ? `<button class="link-btn" data-confirm-order="${o.id}">Confirm</button>` : ''}
        <span class="status ${o.status}">${label[o.status]}</span>
        <b>${money(o.status === 'confirmed' ? o.paid : o.estTotal)}</b>
        ${o.status !== 'declined' ? `<span class="muted" style="font-size:12px;min-width:90px;text-align:right">${s >= 0 ? 'saved ' + money(s) : 'cost ' + money(-s) + ' more'} ${vs(o)}</span>` : '<span style="min-width:90px"></span>'}</div>`;
    }).join('')}
  </section>`;
}

/* ==================================================================
 * Item options (modifiers): choose them, and see what each costs on every platform.
 * ================================================================== */
function openCustomise(itemId) {
  const rid = itemId.split('::')[0], r = state.restaurants.find(x => x.id === rid), it = r && findItem(r, itemId);
  if (!it) return;
  const on = PKEYS.filter(k => r.platforms[k]);
  const chip = (k, o) => {
    const d = o.prices[k];
    if (d === null || d === undefined) return `<span class="price na">${badge(k)} n/a</span>`;
    const m = o.prices.instore > 0 ? d / o.prices.instore - 1 : (d > 0 ? 1 : 0);
    return `<span class="price">${badge(k)} <b>${d ? '+' + money(d) : 'free'}</b>${o.prices.instore > 0 && m > 0.004 ? `<span class="pct">${pct(m)}</span>` : !o.prices.instore && d > 0 ? '<span class="pct">free in-store</span>' : ''}</span>`;
  };
  const dlg = $('#dlg');
  dlg.innerHTML = `<form id="customiseForm" data-item="${esc(it.id)}">
    <h2>${esc(it.name)}</h2>
    <p class="muted" style="margin:0;font-size:14px">${esc(it.desc)}</p>
    ${it.groups.map((g, gi) => `<fieldset class="mod-group">
      <legend>${esc(g.name)} <span class="muted">${g.multi ? 'choose any' : 'choose one'}${g.required ? ' · required' : ''}</span></legend>
      ${g.options.map((o, oi) => `<label class="mod-opt">
        <input type="${g.multi ? 'checkbox' : 'radio'}" name="g${gi}" value="${esc(o.id)}" ${g.required && !g.multi && oi === 0 ? 'checked' : ''}>
        <span class="mod-name">${esc(o.name)}</span>
        <span class="prices"><span class="price instore">In-store <b>${o.prices.instore ? '+' + money(o.prices.instore) : 'free'}</b></span>${on.map(k => chip(k, o)).join('')}</span>
      </label>`).join('')}
    </fieldset>`).join('')}
    <div class="mod-total" id="modTotal"></div>
    <div class="dlg-actions" style="flex-direction:row;align-items:center">
      <div class="qty"><button type="button" data-mq="-1" aria-label="One fewer">−</button><b id="modQty">1</b><button type="button" data-mq="1" aria-label="One more">+</button></div>
      <button class="btn" type="submit" style="flex:1">Add to cart</button>
    </div>
    <button class="link-btn" type="button" data-close-dlg style="display:block;margin:10px auto 0">Cancel</button>
  </form>`;
  updateCustomiseTotal();
  dlg.showModal();
}
function customiseSelection() {
  const f = $('#customiseForm'); if (!f) return null;
  return { itemId: f.dataset.item, opts: [...f.querySelectorAll('input:checked')].map(i => i.value), qty: +($('#modQty').textContent) || 1 };
}
function updateCustomiseTotal() {
  const sel = customiseSelection(); if (!sel) return;
  const r = state.restaurants.find(x => x.id === sel.itemId.split('::')[0]);
  const line = { itemId: sel.itemId, opts: sel.opts, qty: 1 };
  const inst = unitPrice(r, line, 'instore').price;
  const rows = PKEYS.filter(k => r.platforms[k]).map(k => [k, unitPrice(r, line, k)]);
  const avail = rows.filter(([, u]) => !u.missing);
  const best = avail.length ? Math.min(...avail.map(([, u]) => u.price)) : null;
  $('#modTotal').innerHTML = `<div class="muted" style="font-size:13px;margin-bottom:6px">This item as chosen, each</div>
    <div class="prices"><span class="price instore">In-store <b>${money(inst)}</b></span>
    ${rows.map(([k, u]) => u.missing ? `<span class="price na">${badge(k)} not offered</span>`
      : `<span class="price ${u.price === best ? 'best' : ''}">${badge(k)} <b>${money(u.price)}</b>${u.price / inst - 1 > 0.004 ? `<span class="pct">${pct(u.price / inst - 1)}</span>` : ''}</span>`).join('')}</div>`;
}
document.addEventListener('change', e => { if (e.target.closest('#customiseForm')) updateCustomiseTotal(); });

/* ==================================================================
 * "Wrong price?" reports
 * ================================================================== */
function openReport(rid, itemId) {
  const r = state.restaurants.find(x => x.id === rid); if (!r) return;
  const on = PKEYS.filter(k => r.platforms[k]);
  const dlg = $('#dlg');
  dlg.innerHTML = `<form id="reportForm" data-rid="${esc(r.id)}">
    <h2>Report a price at ${esc(r.name)}</h2>
    <p class="muted" style="margin:0;font-size:14px">Spotted a different price, fee or deal? Tell us and we'll re-check it.</p>
    <label class="field">What's wrong?
      <select name="item">
        ${r.menu.map(s => `<optgroup label="${esc(s.section)}">${s.items.map(it => `<option value="${esc(it.id)}" ${it.id === itemId ? 'selected' : ''}>${esc(it.name)}</option>`).join('')}</optgroup>`).join('')}
        <option value="" ${itemId ? '' : 'selected'}>A deal, fee or something else</option>
      </select></label>
    <div class="field">Where?
      <div class="radios">
        <label><input type="radio" name="platform" value="instore"> In-store</label>
        ${on.map((k, i) => `<label><input type="radio" name="platform" value="${k}" ${i === 0 ? 'checked' : ''}> ${PLATFORMS[k].label}</label>`).join('')}
      </div></div>
    <label class="field">Price you saw (optional)<input name="seen" inputmode="decimal" placeholder="e.g. 21.40"></label>
    <label class="field">Anything else? (optional)<textarea name="note" placeholder="e.g. New menu, or there's a 20% off deal on DoorDash"></textarea></label>
    <div class="dlg-actions"><button class="btn" type="submit">Send report</button><button class="btn secondary" type="button" data-close-dlg>Cancel</button></div>
  </form>`;
  dlg.showModal();
}
function submitReport(f, rid) {
  const r = state.restaurants.find(x => x.id === rid); if (!r) return;
  const it = f.get('item') ? findItem(r, f.get('item')) : null;
  const platform = f.get('platform') || '';
  const shown = it && platform ? (platform === 'instore' ? it.prices.instore : it.prices[platform]) : null;
  const rp = { date: Date.now(), restaurantId: r.id, restaurant: r.name, item: it ? it.name : 'Deal, fee or other',
               platform: platform === 'instore' ? '' : platform, where: platform === 'instore' ? 'In-store' : (PLATFORMS[platform]?.label || ''),
               shown, seen: num(f.get('seen')), note: (f.get('note') || '').trim() };
  $('#dlg').close();
  track('Price report', { restaurant: rp.restaurant });
  deliverReports([rp], r);
}
// Every report (a "Wrong price?" report, or a different order total) goes the same way:
// to the Google Form if one is set up (you get an email per response), else to an email draft, else it stays on the device.
function deliverReports(reports, r) {
  profile.reports.push(...reports); profile.reports = profile.reports.slice(-50); saveProfile();
  const fresh = r ? freshness(r.source, r.checkedAt).long : '';
  if (REPORT_FORM_PREFILL_URL) {
    try {
      const u = new URL(REPORT_FORM_PREFILL_URL), action = REPORT_FORM_PREFILL_URL.split('?')[0].replace(/\/viewform$/, '/formResponse');
      for (const rp of reports) {
        const map = { RESTAURANT: rp.restaurant, ITEM: rp.item, WHERE: rp.where || 'n/a', SHOWN: rp.shown != null ? money(rp.shown) : 'n/a',
          SEEN: rp.seen != null ? money(rp.seen) : 'not given', NOTE: [rp.note, fresh].filter(Boolean).join(' | ') || '-' };
        const fd = new URLSearchParams();
        for (const [k, v] of u.searchParams) if (k.startsWith('entry.')) fd.append(k, map[v] ?? v);
        fetch(action, { method: 'POST', mode: 'no-cors', body: fd });
      }
      toast('Thanks! Sent to the Dinkum team.');
    } catch { toast('Thanks! Saved.'); }
  } else if (REPORT_EMAIL) {
    const body = reports.map(rp => [`Restaurant: ${rp.restaurant} (${rp.restaurantId})`, `What: ${rp.item}`, `Where: ${rp.where || 'n/a'}`,
      `${APP_NAME} shows: ${rp.shown != null ? money(rp.shown) : 'n/a'}${fresh ? ` (${fresh})` : ''}`, `They saw: ${rp.seen != null ? money(rp.seen) : 'not given'}`,
      `Note: ${rp.note || '-'}`].join('\n')).join('\n\n') + `\n\nReported: ${new Date().toLocaleString('en-AU')}`;
    location.href = `mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(`${APP_NAME} price report: ${reports[0].restaurant}, ${reports[0].item}`)}&body=${encodeURIComponent(body)}`;
    toast('Thanks! Your email app should open with the report ready to send.');
  } else {
    toast('Thanks! Saved. (Reports aren’t sent anywhere until the report form is set up.)');
  }
  if (state.view === 'profile') rerenderInPlace();
}

$('#scrim').addEventListener('click', () => openCart(false));
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#cart').classList.contains('open')) openCart(false); });

init();
</script>
